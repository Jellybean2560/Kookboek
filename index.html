<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kookboek</title>
<meta name="description" content="Jullie eigen receptenboek: kies wat je eet en schaal recepten naar het aantal personen.">
<meta name="theme-color" content="#c4532f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kookboek">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6f0;
  --surface: #ffffff;
  --surface-2: #f3ece2;
  --text: #2b2420;
  --muted: #7a6d63;
  --line: #e7ddd0;
  --accent: #c4532f;
  --accent-ink: #ffffff;
  --accent-soft: #f8e3d9;
  --ok: #3f7d4e;
  --ok-soft: #e1efe3;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 14px rgba(60, 40, 20, .06);
  --radius: 16px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1613;
    --surface: #25201c;
    --surface-2: #2f2924;
    --text: #f1e9e1;
    --muted: #a99c90;
    --line: #3a332d;
    --accent: #e7774f;
    --accent-ink: #1a1613;
    --accent-soft: #43281d;
    --ok: #7cc28c;
    --ok-soft: #22352a;
    --danger: #f2827a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1613; --surface: #25201c; --surface-2: #2f2924; --text: #f1e9e1; --muted: #a99c90;
  --line: #3a332d; --accent: #e7774f; --accent-ink: #1a1613; --accent-soft: #43281d;
  --ok: #7cc28c; --ok-soft: #22352a; --danger: #f2827a; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
:root { --scale: 1; }
body {
  background: var(--bg);
  color: var(--text);
  font: calc(16px * var(--scale))/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
}
h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; line-height: 1.2; margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 21px; }
h3 { font-size: 17px; font-family: Inter, sans-serif; font-weight: 600; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
input, textarea, select {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 140px; line-height: 1.45; }
label.field { display: block; margin-bottom: 16px; }
label.field > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

.wrap { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px 0; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.page-head h1 { flex: 1; }
.back {
  width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--surface);
  box-shadow: var(--shadow); font-size: 20px; cursor: pointer; flex: none;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: 999px; padding: 12px 20px; font-weight: 600; cursor: pointer;
  background: var(--surface-2); color: var(--text); text-decoration: none; min-height: 46px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
.card h2 { margin-bottom: 6px; }
.card p { margin: 0 0 14px; color: var(--muted); }

/* Wizard */
.step-label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.question { font-size: 30px; margin-bottom: 20px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .choices { grid-template-columns: repeat(3, 1fr); } }
.choice {
  background: var(--surface); border: 2px solid transparent; border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 12px; cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 120px; justify-content: center;
}
.choice:active { transform: scale(.98); }
.choice .emoji { font-size: 40px; line-height: 1; }
.choice .name { font-weight: 600; }
.choice .count { font-size: 13px; color: var(--muted); }
.choice.empty { opacity: .45; }
.choice.any { background: var(--accent-soft); }
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface-2); font-size: 14px; border: 1.5px solid transparent; cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }

/* Recipe list */
.recipe-item {
  display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 10px; margin-bottom: 10px; cursor: pointer; text-decoration: none; color: inherit;
}
.thumb {
  width: 76px; height: 76px; border-radius: 12px; flex: none; background: var(--surface-2) center/cover no-repeat;
  display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.recipe-item .info { min-width: 0; flex: 1; }
.recipe-item .title { font-weight: 600; line-height: 1.3; margin-bottom: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty-state .big { font-size: 56px; }
.empty-state h2 { color: var(--text); margin: 10px 0 8px; }
.search { margin-bottom: 12px; }
.list-tools { display: flex; gap: 10px; align-items: center; margin: 12px 0 14px; }
.list-tools .count { flex: 1; font-size: 14px; color: var(--muted); }
.list-tools select { width: auto; padding: 8px 12px; font-size: 14px; }

/* Detail */
.hero { margin: calc(-20px - env(safe-area-inset-top)) -16px 16px; position: relative; }
.hero img { width: 100%; max-height: 340px; object-fit: cover; display: block; }
.hero .back { position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 14px; }
.hero.noimg { height: calc(env(safe-area-inset-top) + 68px); }
.detail-title { font-size: calc(28px * var(--scale)); margin-bottom: 8px; }
.source { font-size: 14px; color: var(--muted); margin-bottom: 14px; display: block; }
.servings {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--accent-soft); border-radius: var(--radius); padding: 10px 12px; margin: 16px 0;
}
.servings .label { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--surface);
  font-size: 22px; cursor: pointer; box-shadow: var(--shadow);
}
.stepper .n { min-width: 92px; text-align: center; font-weight: 600; }
.scaled-note { font-size: 13px; color: var(--muted); margin: -8px 0 14px; }
.ingredients { list-style: none; padding: 0; margin: 0 0 24px; }
.ingredients li { display: flex; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.ingredients li .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.ingredients li.done { color: var(--muted); text-decoration: line-through; }
.ingredients li.done .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.ingredients li.head, .steps li.head { cursor: default; border: none; font-weight: 600; padding-top: 16px; color: var(--accent); }
.qty { font-weight: 600; }
.steps { list-style: none; padding: 0; margin: 0 0 24px; counter-reset: step; }
.steps li.step { position: relative; padding: 12px 12px 12px 52px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; }
.steps li.step::before {
  counter-increment: step; content: counter(step); position: absolute; left: 10px; top: 11px;
  width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: flex;
  align-items: center; justify-content: center; font-weight: 600; font-size: 14px;
}
.steps li.step.done { color: var(--muted); }
.steps li.step.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
.steps li.step.current { background: var(--surface); box-shadow: var(--shadow); }
.steps li.step.current::before { background: var(--accent); color: var(--accent-ink); }
.notes { white-space: pre-wrap; background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 24px; }
.section-title { margin: 8px 0 10px; }
.cooked-bar { display: flex; gap: 10px; align-items: center; background: var(--ok-soft); color: var(--text); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }

/* Scan */
.scan-pages { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.scan-page { position: relative; width: 84px; height: 112px; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.scan-page img { width: 100%; height: 100%; object-fit: cover; }
.scan-page button {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: none;
  background: rgba(0, 0, 0, .6); color: #fff; font-size: 13px; cursor: pointer;
}

/* Edit form */
.photo-edit { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.photo-edit .thumb { width: 96px; height: 96px; }
.photo-edit .row { flex: 1; }
.form-actions { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px); display: flex; gap: 10px; padding: 10px 0; background: linear-gradient(transparent, var(--bg) 30%); }
.form-actions .btn { flex: 1; }

/* Nav */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); height: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
nav.tabs a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 500; min-width: 0; white-space: nowrap; letter-spacing: -.01em;
}
nav.tabs a .ic { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .7; position: relative; }
nav.tabs a .badge {
  position: absolute; top: -6px; right: -12px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
  background: var(--accent); color: var(--accent-ink); font: 700 11px/18px Inter, sans-serif; text-align: center;
}
nav.tabs a .ic:has(.badge:not([hidden])) { filter: none; opacity: 1; }

/* Shopping list */
.shop li { transition: transform .2s; position: relative; background: var(--bg); }
.shop li.swiping { background: var(--ok-soft); }
.shop li[style*="translateX"] { transition: none; }
.pin-btn { flex: none; border: none; background: none; font-size: 15px; padding: 6px 2px; cursor: pointer; opacity: .35; filter: grayscale(1); }
.pin-btn.on { opacity: 1; filter: none; }
.cg-btn.pinned { background: var(--ok-soft); color: var(--ok); }
.day-chip { border: none; background: var(--accent-soft); color: var(--text); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 3px 9px; margin-top: 6px; cursor: pointer; }

/* Week menu */
.tonight { margin-bottom: 22px; }
.week-strip { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px 22px; padding: 0 16px 6px; scrollbar-width: none; }
.week-strip::-webkit-scrollbar { display: none; }
.week-day { flex: none; width: 104px; text-decoration: none; color: inherit; background: none; border: none; padding: 0; text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
.week-day b { display: block; font-size: 12px; text-transform: capitalize; color: var(--accent); margin-bottom: 4px; }
.week-day .pic { width: 104px; height: 72px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; }
.week-day .pic img { width: 100%; height: 100%; object-fit: cover; }
.week-day span { display: block; font-size: 13px; line-height: 1.25; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.week-day.empty .pic { border: 2px dashed var(--line); background: transparent; color: var(--muted); font-size: 24px; }
.week-day.empty span { color: var(--muted); }
.day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.day-opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.day-opt b { display: block; text-transform: capitalize; }
.day-opt span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-opt.on { border-color: var(--accent); background: var(--accent-soft); }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0); display: flex; align-items: flex-end; justify-content: center; transition: background .2s; }
.sheet-wrap.open { background: rgba(0, 0, 0, .4); }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); transform: translateY(30px); opacity: 0; transition: .2s; }
.sheet-wrap.open .sheet { transform: none; opacity: 1; }
.sheet-list { margin: 6px 0 0; padding-left: 20px; }
.sheet-list li { margin-bottom: 4px; }
.side-sugg { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.side-sugg p { margin: 2px 0 8px; }

/* Cook log */
.log { list-style: none; padding: 0; margin: 0 0 10px; }
.log li { display: flex; gap: 10px; background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.log li > div { flex: 1; }
.log li b { font-size: 13px; color: var(--muted); font-weight: 600; }
.log li p { margin: 2px 0 0; white-space: pre-wrap; }
.log-x { border: none; background: none; color: var(--muted); cursor: pointer; align-self: flex-start; }

/* Cook mode tools */
.cook-tool { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 17px; color: var(--text); padding: 0; }
.cook-tool small { font-size: 11px; }
.cook-tool.on { background: var(--accent); border-color: var(--accent); }

.offline-pill { position: fixed; left: 12px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px); z-index: 25; background: var(--text); color: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 12px; box-shadow: var(--shadow); max-width: calc(100% - 24px); }
body.cooking .offline-pill { bottom: calc(env(safe-area-inset-bottom) + 96px); }
.menu-row { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px 18px; padding: 0 16px 6px; scrollbar-width: none; }
.menu-row::-webkit-scrollbar { display: none; }
.menu-card { flex: none; width: 140px; position: relative; }
.menu-card a { text-decoration: none; color: inherit; }
.menu-card .pic { width: 140px; height: 90px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 38px; overflow: hidden; box-shadow: var(--shadow); }
.menu-card .pic img { width: 100%; height: 100%; object-fit: cover; }
.menu-card .t { font-size: 14px; font-weight: 600; line-height: 1.3; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.menu-card .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; font-size: 13px; }
.menu-card .srv { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 2px; }
.menu-card .srv button { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1; padding: 0; color: var(--text); }
.menu-card.add .pic { border: 2px dashed var(--line); box-shadow: none; background: transparent; font-size: 30px; color: var(--muted); }
.menu-card .done { position: absolute; top: 6px; left: 6px; background: var(--ok); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 8px; font-weight: 600; }
.shop { list-style: none; padding: 0; margin: 0 0 20px; }
.shop li { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.shop li .box { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; background: none; color: inherit; padding: 0; }
.shop li .what { flex: 1; min-width: 0; cursor: pointer; }
.shop li .from { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop li.done .what { color: var(--muted); text-decoration: line-through; }
.shop li.done .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.cg-btn {
  flex: none; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-size: 13px; font-weight: 600;
  padding: 7px 11px; border-radius: 999px; background: #e9f0fb; color: #1d4f9c; white-space: nowrap;
}
:root[data-theme="dark"] .cg-btn { background: #1d2a40; color: #a9c6f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cg-btn { background: #1d2a40; color: #a9c6f5; } }
.shop-head { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 4px; }
.shop-head h3 { flex: 1; }
.shop-head small { color: var(--muted); font-size: 13px; }
details.staples summary { cursor: pointer; font-weight: 600; padding: 8px 0; color: var(--muted); }
.pick-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; margin-bottom: 8px; cursor: pointer; }
.pick-item .thumb { width: 56px; height: 56px; font-size: 26px; }
.pick-item .info { flex: 1; min-width: 0; }
.pick-item .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex: none; }
.pick-item.on { outline: 2px solid var(--accent); }
.pick-item.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav.tabs a.on { color: var(--accent); }
nav.tabs a.on .ic { filter: none; opacity: 1; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; z-index: 20;
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; max-width: calc(100% - 32px);
  font-size: 14px; pointer-events: none; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.action { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
.toast-btn { background: none; border: none; color: var(--accent-soft); font-weight: 700; cursor: pointer; padding: 4px 2px; white-space: nowrap; }
body.cooking .toast { bottom: 110px; }

/* Photo cards */
.cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
.photo-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; text-decoration: none; color: inherit; display: block; position: relative; }
.photo-card .pic { aspect-ratio: 16 / 10; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 64px; overflow: hidden; }
.photo-card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-card .body { padding: 12px 14px 14px; }
.photo-card .title { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 19px; line-height: 1.25; margin-bottom: 6px; }
.fav-badge { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, .9); border-radius: 999px; padding: 4px 9px; font-size: 13px; font-weight: 600; color: #2b2420; }
.meta .stars-mini { color: #e0a526; }

/* Suggestions on the home screen */
.suggest { margin-bottom: 22px; }
.suggest h3 { margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.suggest h3 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.mini-row { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; scrollbar-width: none; }
.mini-row::-webkit-scrollbar { display: none; }
.mini-card { flex: none; width: 128px; text-decoration: none; color: inherit; }
.mini-card .pic { width: 128px; height: 84px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; box-shadow: var(--shadow); }
.mini-card .pic img { width: 100%; height: 100%; object-fit: cover; }
.mini-card .t { font-size: 14px; font-weight: 600; line-height: 1.3; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.week-line { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 22px; padding: 0 16px; scrollbar-width: none; }
.week-line::-webkit-scrollbar { display: none; }
.week-line a { flex: none; text-decoration: none; color: inherit; background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 8px 12px; font-size: 13px; max-width: 200px; }

.pantry-link { display: flex; align-items: center; gap: 14px; margin-top: 18px; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); padding: 16px; text-decoration: none; color: inherit; }
.pantry-link .emoji { font-size: 34px; }

.pantry-link span { font-size: 14px; color: var(--muted); }

/* Favourite + rating */
.rate-row { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
.fav-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 15px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fav-btn.on { border-color: #d9455f; background: #fde7eb; color: #8c1d33; }
:root[data-theme="dark"] .fav-btn.on { background: #4a1f29; color: #ffd0d9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fav-btn.on { background: #4a1f29; color: #ffd0d9; } }
.stars { display: flex; }
.stars button { background: none; border: none; font-size: 26px; line-height: 1; padding: 2px; cursor: pointer; color: var(--line); }
.stars button.on { color: #e0a526; }

/* Timers (in steps and in the floating bar) */

  display: inline-flex; align-items: center; gap: 4px; border: none; border-radius: 999px; background: var(--accent-soft);
  color: var(--text); font: inherit; font-size: .88em; font-weight: 600; padding: 1px 9px; margin: 0 2px; cursor: pointer; white-space: nowrap;
}
/* Sticky in the page flow, so however many timers run they push the page

#timers { position: sticky; top: 0; z-index: 30; display: flex; flex-direction: column; gap: 6px; padding: 0 12px; pointer-events: none; }
body.has-timers #timers { padding-top: calc(env(safe-area-inset-top) + 8px); }
.timer-pill {
  pointer-events: auto; align-self: center; display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--bg);
  border-radius: 999px; padding: 8px 8px 8px 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); font-size: 15px; max-width: 100%;
}
.timer-pill .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px; }
.timer-pill .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
.timer-pill button { border: none; background: rgba(255, 255, 255, .18); color: inherit; border-radius: 999px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
.timer-pill.done { background: var(--accent); color: var(--accent-ink); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
body.has-timers .wrap { padding-top: 14px; }
body.has-timers .hero { margin-top: -14px; }
body.has-timers .hero .back { top: 14px; }

/* Cook mode */
body.cooking nav.tabs { display: none; }

.cook { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; margin-top: calc(-20px - env(safe-area-inset-top)); padding-top: calc(env(safe-area-inset-top) + 12px); }
body.has-timers .cook { margin-top: -14px; padding-top: 10px; }
.cook-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.cook-top .title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cook-progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }

.cook-stepno { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
.cook-text { font-size: calc(25px * var(--scale)); line-height: 1.45; margin-bottom: 24px; }
.cook-text .timer-chip { font-size: .8em; padding: 3px 12px; }
.cook-need { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.cook-need h3 { margin-bottom: 6px; font-size: 14px; color: var(--muted); }
.cook-need li { padding: 4px 0; }
.cook-need ul { list-style: none; padding: 0; margin: 0; }
.cook-nav { position: sticky; bottom: 0; display: flex; gap: 12px; padding: 16px 0 calc(env(safe-area-inset-bottom) + 16px); background: linear-gradient(transparent, var(--bg) 25%); }
.cook-nav .btn { flex: 1; min-height: 58px; font-size: 18px; }
.cook-start { margin: 0 0 16px; }

/* In huis */
.pantry-input { display: flex; gap: 8px; margin-bottom: 12px; }
.pantry-chips .chip { cursor: pointer; }
.match { font-size: 13px; margin-top: 4px; }

.spinner { width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
.sync-dot.off { background: var(--muted); }
.sync-dot.err { background: var(--danger); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; letter-spacing: .08em; font-weight: 600; background: var(--surface-2); border-radius: 12px; padding: 12px; text-align: center; margin-bottom: 12px; user-select: all; }

.banner .x { margin-left: auto; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); padding: 0 4px; }
</style>

<body>
<div id="timers"></div>
<main class="wrap" id="view"></main>

<nav class="tabs" id="nav">
  <a href="#/vandaag" data-nav="vandaag"><span class="ic">🍳</span>Wat eten we?</a>
  <a href="#/recepten" data-nav="recepten"><span class="ic">📖</span>Recepten</a>
  <a href="#/boodschappen" data-nav="boodschappen"><span class="ic">🛒<b class="badge" id="list-badge" hidden></b></span>Boodschappen</a>
  <a href="#/toevoegen" data-nav="toevoegen"><span class="ic">➕</span>Toevoegen</a>
  <a href="#/instellingen" data-nav="instellingen"><span class="ic">⚙️</span>Instellingen</a>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';

const API = localStorage.getItem('kb_api') || 'https://kookboek.jellevandenwouwer.workers.dev';

const BASES = [
  { id: 'aardappelen', label: 'Aardappelen', emoji: '🥔', words: ['aardappel', 'krieltje', 'friet', 'frietjes', 'patat', 'puree', 'gratin', 'rösti', 'roseval', 'potato', 'kroket', 'wedges', 'stamppot'] },
  { id: 'rijst', label: 'Rijst', emoji: '🍚', words: ['rijst', 'risotto', 'paella', 'basmati', 'jasmijn', 'pandan', 'rice', 'nasi', 'sushi'] },
  { id: 'pasta', label: 'Pasta & noedels', emoji: '🍝', words: ['pasta', 'spaghetti', 'penne', 'tagliatelle', 'macaroni', 'lasagne', 'lasagna', 'fusilli', 'farfalle', 'linguine', 'orzo', 'gnocchi', 'ravioli', 'tortellini', 'rigatoni', 'noedel', 'noodle', 'mie', 'udon', 'ramen', 'bami', 'conchiglie', 'pappardelle', 'fettuccine'] },
  { id: 'brood', label: 'Brood & wraps', emoji: '🥖', words: ['brood', 'wrap', 'tortilla', 'burger', 'pistolet', 'pita', 'naan', 'stokbrood', 'ciabatta', 'focaccia', 'taco', 'broodje', 'bun', 'croque', 'toast', 'pizza'] },
  { id: 'anders', label: 'Iets anders', emoji: '🥗', words: [] },
];
const PROTEINS = [
  { id: 'kip', label: 'Kip', emoji: '🍗', words: ['kip', 'kippen', 'chicken', 'kalkoen', 'gevogelte', 'eend'] },
  { id: 'gehakt', label: 'Gehakt', emoji: '🍔', words: ['gehakt', 'gehaktbal', 'balletjes', 'mince', 'half-om-half', 'kefta', 'köfte'] },
  { id: 'rund', label: 'Steak & rund', emoji: '🥩', words: ['steak', 'biefstuk', 'rundvlees', 'runder', 'entrecote', 'entrecôte', 'ossenhaas', 'rib-eye', 'ribeye', 'rosbief', 'stoofvlees', 'beef', 'bavette', 'kalfs', 'carpaccio', 'lams', 'lamsvlees'] },
  { id: 'varken', label: 'Varken & worst', emoji: '🥓', words: ['varken', 'spek', 'ham', 'worst', 'chorizo', 'pancetta', 'bacon', 'spareribs', 'pork', 'karbonade', 'kotelet', 'lardons', 'salami', 'saucijs', 'prosciutto', 'filet mignon', 'hesp'] },
  { id: 'vis', label: 'Vis', emoji: '🐟', words: ['zalm', 'kabeljauw', 'tonijn', 'vis', 'salmon', 'pangasius', 'tilapia', 'makreel', 'forel', 'schelvis', 'koolvis', 'heek', 'tong', 'zeebaars', 'dorade', 'ansjovis', 'sardine', 'schol', 'wijting'] },
  { id: 'zeevruchten', label: 'Scampi & zeevruchten', emoji: '🦐', words: ['scampi', 'garnaal', 'garnalen', 'mosselen', 'mossel', 'shrimp', 'prawn', 'inktvis', 'calamar', 'sint-jakob', 'kreeft', 'krab', 'gamba'] },
  { id: 'vega', label: 'Vegetarisch', emoji: '🥦', words: [] },
  { id: 'anders', label: 'Iets anders', emoji: '🍽️', words: [] },
];
const BASE_BY_ID = Object.fromEntries(BASES.map(b => [b.id, b]));
const PROTEIN_BY_ID = Object.fromEntries(PROTEINS.map(p => [p.id, p]));

// ── Storage ─────────────────────────────────────────────────────────────────
// Recipes live in IndexedDB (photos make them too big for localStorage);
// small settings and sync bookkeeping in localStorage.

const recipes = new Map();
let idb = null;

function openDb() {
  return new Promise((resolve) => {
    let req;
    try { req = indexedDB.open('kookboek', 1); } catch { return resolve(null); }
    req.onupgradeneeded = () => req.result.createObjectStore('recipes', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}
function dbTx(mode, fn) {
  if (!idb) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const tx = idb.transaction('recipes', mode);
    const out = fn(tx.objectStore('recipes'));
    tx.oncomplete = () => resolve(out && out.result);
    tx.onerror = () => reject(tx.error);
  });
}
const dbAll = () => dbTx('readonly', s => s.getAll());
const dbPut = (r) => dbTx('readwrite', s => s.put(r));
const dbPutMany = (rs) => dbTx('readwrite', s => rs.forEach(r => s.put(r)));

function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const settings = Object.assign({ book: '', seq: 0, lastSync: 0, defaultServings: 0, hideInstall: false, lastExport: 0, backupNagAt: 0 }, lsGet('kb_settings', {}));
const saveSettings = () => lsSet('kb_settings', settings);
let dirty = new Set(lsGet('kb_dirty', []));
const saveDirty = () => lsSet('kb_dirty', [...dirty]);

// `recipes` also holds the shopping list, as small documents with a `kind`
// ('plan' = a recipe on the menu, 'item' = one line on the list), so they
// sync the same way and two phones can tick items off at the same time.
const liveRecipes = () => [...recipes.values()].filter(r => !r.deleted && !r.kind);
const liveDocs = (kind) => [...recipes.values()].filter(r => !r.deleted && r.kind === kind);

async function saveRecipe(r) {
  r.updatedAt = Math.max(Date.now(), (recipes.get(r.id)?.updatedAt || 0) + 1);
  recipes.set(r.id, r);
  await dbPut(r);
  dirty.add(r.id); saveDirty();
  scheduleSync();
}

// Deleted recipes keep their contents for TRASH_DAYS so they can be restored
// (also from the other phone), then shrink to a bare tombstone.
const TRASH_DAYS = 30;

async function deleteRecipe(id) {
  const r = recipes.get(id);
  if (!r || r.deleted) return;
  await saveRecipe({ ...r, deleted: true, deletedAt: Date.now() });
}

async function restoreRecipe(id) {
  const r = recipes.get(id);
  if (!r || !r.deleted) return;
  const { deleted, deletedAt, ...rest } = r;
  await saveRecipe(rest);
}

const trashedRecipes = () => [...recipes.values()]
  .filter(r => r.deleted && !r.kind && r.title && r.deletedAt > Date.now() - TRASH_DAYS * 86400000)
  .sort((a, b) => b.deletedAt - a.deletedAt);

async function emptyOldTrash() {
  for (const r of recipes.values()) {
    if (r.deleted && r.title && !(r.deletedAt > Date.now() - TRASH_DAYS * 86400000)) {
      await saveRecipe({ id: r.id, deleted: true, deletedAt: r.deletedAt || Date.now(), createdAt: r.createdAt });
    }
  }
}

function newId() {
  const a = new Uint8Array(9); crypto.getRandomValues(a);
  return Date.now().toString(36) + '-' + [...a].map(b => b.toString(36).padStart(2, '0')).join('').slice(0, 10);
}

// ── Sync ────────────────────────────────────────────────────────────────────

let syncing = false, syncTimer = null, syncError = '';

function scheduleSync(delay = 800) {
  if (!settings.book) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay);
}

async function sync() {
  if (!settings.book || syncing || !navigator.onLine) return;
  syncing = true;
  let changedAny = false;
  try {
    do {
      // Keep each request well under the Worker's body limit; photos are big.
      const batch = [];
      let size = 0;
      for (const id of dirty) {
        const r = recipes.get(id);
        if (!r) { dirty.delete(id); continue; }
        const len = JSON.stringify(r).length;
        if (batch.length && (size + len > 4_000_000 || batch.length >= 200)) break;
        batch.push(r); size += len;
      }
      const sentAt = new Map(batch.map(r => [r.id, r.updatedAt]));
      const res = await fetch(`${API}/b/${encodeURIComponent(settings.book)}/sync`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ since: settings.seq || 0, changes: batch }),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || `Fout ${res.status}`);

      const incoming = [];
      for (const r of out.changes || []) {
        const cur = recipes.get(r.id);
        if (!cur || r.updatedAt > cur.updatedAt) { recipes.set(r.id, r); incoming.push(r); }
      }
      if (incoming.length) { await dbPutMany(incoming); changedAny = true; }
      for (const [id, at] of sentAt) if (recipes.get(id)?.updatedAt === at) dirty.delete(id);
      saveDirty();
      settings.seq = out.seq; settings.lastSync = Date.now(); saveSettings();
      if (!batch.length) break;
    } while (dirty.size);
    syncError = '';
  } catch (e) {
    syncError = e.message || 'Synchroniseren mislukt';
  } finally {
    syncing = false;
    if (changedAny && !location.hash.startsWith('#/bewerk')) render();
    else if (currentRoute() === 'instellingen') render();
  }
}

function makeBookCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = new Uint8Array(12); crypto.getRandomValues(a);
  const s = [...a].map(b => alphabet[b % alphabet.length]).join('');
  return `${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8)}`;
}
const normaliseCode = (c) => c.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^(.{4})(.{4})(.+)$/, '$1-$2-$3');

async function joinBook(code) {
  settings.book = code; settings.seq = 0; saveSettings();
  // Send everything this phone has; the merge keeps the newest version of each.
  recipes.forEach((_, id) => dirty.add(id)); saveDirty();
  await sync();
  toast(syncError ? 'Gekoppeld, maar synchroniseren lukte nog niet: ' + syncError : 'Gekoppeld! Jullie recepten zijn samengevoegd.');
  render();
}

// ── Helpers ─────────────────────────────────────────────────────────────────

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel) => document.querySelector(sel);

let toastTimer;
// action: {label, run} adds a button (e.g. "Ongedaan maken") and keeps the
// toast up longer.
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button class="toast-btn">${esc(action.label)}</button>` : '');
  t.classList.toggle('action', !!action);
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); action.run(); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 6500 : 2800);
}

function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } }

function daysAgo(ts) {
  if (!ts) return '';
  const d = Math.floor((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
  if (d <= 0) return 'vandaag';
  if (d === 1) return 'gisteren';
  if (d < 14) return `${d} dagen geleden`;
  if (d < 60) return `${Math.round(d / 7)} weken geleden`;
  return `${Math.round(d / 30)} maanden geleden`;
}
function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

const effBases = (r) => r.bases?.length ? r.bases : ['anders'];
const effProteins = (r) => r.proteins?.length ? r.proteins : ['anders'];

function guessTags(title, ingredients) {
  // Stock and sauces don't make a dish chicken or fish.
  const text = (' ' + [title, ...ingredients].join(' \n ').toLowerCase() + ' ')
    .replace(/(vis|kippen|kip|runder|rund|groente)(saus|bouillon|fond|blokje)\w*/g, ' ')
    // Nor do curry paste or tomato purée make it pasta or mash.
    // Bread used as an ingredient (stoofvlees, breadcrumbs) isn't a bread meal.
    .replace(/(snee|sneden|sneetjes?|korst(en)?|stukje)\s+(\w+\s+)?brood\w*|brood(kruim|kruimels|deeg)\w*|paneermeel/g, ' ')
    // Minced beef is "gehakt", not steak.
    .replace(/(runder|rund|varkens|kalfs|lams|kippen|kip)gehakt/g, ' gehakt')
    .replace(/(curry|kerrie|tomaten|sesam|noten|knoflook|gember|chili|miso|kruiden|boemboe)[\s-]?(pasta|puree|purée)/g, ' ');
  const hit = (words) => words.some(w => new RegExp(`[^a-zà-ÿ]${w.replace(/[-]/g, '\\-')}`).test(text));
  const bases = BASES.filter(b => b.words.length && hit(b.words)).map(b => b.id);
  let proteins = PROTEINS.filter(p => p.words.length && hit(p.words)).map(p => p.id);
  if (!proteins.length) proteins = ['vega'];
  return { bases: bases.length ? bases : ['anders'], proteins };
}

function recipeEmoji(r) {
  const b = effBases(r)[0];
  return b === 'anders' ? (PROTEIN_BY_ID[effProteins(r)[0]]?.emoji || '🍽️') : BASE_BY_ID[b].emoji;
}

function thumbHTML(r, cls = 'thumb') {
  const fallback = esc(recipeEmoji(r));
  if (!r.image) return `<div class="${cls}">${fallback}</div>`;
  return `<div class="${cls}"><img src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('${fallback}')"></div>`;
}

function picHTML(r) {
  const fallback = esc(recipeEmoji(r));
  if (!r.image) return `<div class="pic">${fallback}</div>`;
  return `<div class="pic"><img src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith('${fallback}')"></div>`;
}

function photoCardHTML(r, extra = '') {
  return `<a class="photo-card" href="#/recept/${encodeURIComponent(r.id)}">
    ${picHTML(r)}
    ${r.favorite ? '<span class="fav-badge">❤️ Favoriet</span>' : ''}
    <div class="body"><div class="title">${esc(r.title || 'Naamloos recept')}</div><div class="meta">${recipeMeta(r, true)}</div>${extra}</div>
  </a>`;
}

function miniCardHTML(r, sub) {
  return `<a class="mini-card" href="#/recept/${encodeURIComponent(r.id)}">${picHTML(r)}
    <div class="t">${esc(r.title || 'Naamloos recept')}</div><div class="s">${esc(sub)}</div></a>`;
}

const starsText = (n) => '★'.repeat(n);

// Photo cards show a "Favoriet" badge on the picture instead of the heart.
function recipeMeta(r, badge = false) {
  const bits = [];
  if (r.favorite && !badge) bits.push('❤️');
  if (r.rating) bits.push(`<span class="stars-mini">${starsText(r.rating)}</span>`);
  if (r.time) bits.push(`⏱ ${r.time} min`);
  if (r.servings) bits.push(`👥 ${r.servings}`);
  if (r.lastCooked) bits.push(`✓ ${daysAgo(r.lastCooked)}`);
  else if (r.source) bits.push(esc(hostOf(r.source)));
  return bits.map(b => `<span>${b}</span>`).join('');
}

function recipeItemHTML(r) {
  return `<a class="recipe-item" href="#/recept/${encodeURIComponent(r.id)}">
    ${thumbHTML(r)}
    <div class="info"><div class="title">${esc(r.title || 'Naamloos recept')}</div><div class="meta">${recipeMeta(r)}</div></div>
  </a>`;
}

// ── Quantity scaling ────────────────────────────────────────────────────────

const FRACS = { '½': 1 / 2, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 1 / 4, '¾': 3 / 4, '⅛': 1 / 8 };
const NUM = String.raw`(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?(?:\s?[½⅓⅔¼¾⅛])?|[½⅓⅔¼¾⅛])`;
const QTY_RE = new RegExp(String.raw`^(\s*(?:ca\.?|ong\.?|ongeveer|circa|±)?\s*)(${NUM})(\s*(?:-|–|à|tot)\s*(${NUM}))?`, 'i');

function parseNum(s) {
  s = s.trim();
  let m;
  if (/^\d{1,3}\.\d{3}$/.test(s)) return +s.replace('.', '');
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)?\s?([½⅓⅔¼¾⅛])?$/))) return (m[1] ? parseFloat(m[1].replace(',', '.')) : 0) + (m[2] ? FRACS[m[2]] : 0);
  return NaN;
}

function decimal(n, digits) { return String(+n.toFixed(digits)).replace('.', ','); }

function formatQty(n, rest) {
  if (/^\s*(g|gr|gram|kg|kilo|ml|cl|dl|l|liter|deciliter|centiliter|milliliter)\b/i.test(rest)) {
    if (n >= 100) return String(Math.round(n / 5) * 5);
    if (n >= 10) return String(Math.round(n));
    return decimal(n, 1);
  }
  if (n >= 10) return String(Math.round(n));
  const whole = Math.floor(n), frac = n - whole;
  const options = [[0, ''], [1 / 8, '⅛'], [1 / 4, '¼'], [1 / 3, '⅓'], [1 / 2, '½'], [2 / 3, '⅔'], [3 / 4, '¾'], [1, '']];
  let best = options[0];
  for (const o of options) if (Math.abs(frac - o[0]) < Math.abs(frac - best[0])) best = o;
  const w = best[0] === 1 ? whole + 1 : whole;
  if (!w && !best[1]) return decimal(n, 2);
  return (w || '') + best[1];
}

// Returns HTML for one ingredient line with its leading quantity scaled.
function scaleLine(line, factor) {
  const m = line.match(QTY_RE);
  if (!m) return esc(line);
  const rest = line.slice(m[0].length);
  const a = parseNum(m[2]);
  if (!Number.isFinite(a)) return esc(line);
  if (factor === 1) return `${esc(m[1])}<span class="qty">${esc(m[0].slice(m[1].length))}</span>${esc(rest)}`;
  let q = formatQty(a * factor, rest);
  if (m[4]) { const b = parseNum(m[4]); if (Number.isFinite(b)) q += '-' + formatQty(b * factor, rest); }
  return `${esc(m[1])}<span class="qty">${esc(q)}</span>${esc(rest)}`;
}

const isHeading = (line) => /^#/.test(line.trim());
const headingText = (line) => line.trim().replace(/^#+\s*/, '');

// ── Router ──────────────────────────────────────────────────────────────────

function currentRoute() { return location.hash.replace(/^#\/?/, '').split('/')[0] || 'vandaag'; }

let lastPath = null;
function render() {
  const path = location.hash.replace(/^#\/?/, '');
  const [first, ...args] = path.split('/').map(decodeURIComponent);
  const name = first || 'vandaag';
  const view = $('#view');
  if (name !== 'vandaag' && name !== 'recept') todayState.planDay = null;
  const pathChanged = path !== lastPath;
  lastPath = path;
  releaseWakeLock();
  document.body.classList.remove('cooking');
  // Background syncs redraw too; only a real navigation closes an open sheet.
  if (pathChanged) closeSheet();
  if (name !== 'koken' && (cookState.listening || cookState.read)) { stopListening(); cookState.read = false; }

  const navFor = { recept: 'recepten', koken: 'recepten', bewerk: 'toevoegen', inhuis: 'vandaag', koppel: 'instellingen' };
  updateListBadge();
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === (navFor[name] || name)));

  if (name === 'recepten') renderList(view);
  else if (name === 'koken') renderCook(view, args[0], args[1]);
  else if (name === 'inhuis') renderPantry(view);
  else if (name === 'boodschappen') args[0] === 'kies' ? renderPlanPicker(view) : renderShopping(view);
  else if (name === 'toevoegen') renderAdd(view);
  else if (name === 'recept') renderDetail(view, args[0], pathChanged);
  else if (name === 'bewerk') renderEdit(view, args[0]);
  else if (name === 'instellingen') renderSettings(view);
  else if (name === 'koppel') renderJoin(view, args[0]);
  else renderToday(view, args);
  if (pathChanged) window.scrollTo(0, 0);
}

// ── Wat eten we? ────────────────────────────────────────────────────────────

const TIMES = [
  { id: 'snel', label: 'Snel', emoji: '⚡', sub: 'max. 30 minuten', max: 30 },
  { id: 'uur', label: 'Max. een uur', emoji: '⏲️', sub: 'tot 60 minuten', max: 60 },
];
const TIME_BY_ID = Object.fromEntries(TIMES.map(t => [t.id, t]));
const RECENT_DAYS = 7;
const todayState = { showRecent: false };

const isRecent = (r) => r.lastCooked && r.lastCooked > Date.now() - RECENT_DAYS * 86400000;

// Recipes for a wizard path. Recipes without a time can't be judged, so they
// come back separately instead of silently counting as quick.
function wizardSets(base, protein, time) {
  let set = liveRecipes();
  if (base && base !== 'alles') set = set.filter(r => effBases(r).includes(base));
  if (protein && protein !== 'alles') set = set.filter(r => effProteins(r).includes(protein));
  const max = TIME_BY_ID[time]?.max;
  if (!max) return { fits: set, unknown: [] };
  return { fits: set.filter(r => r.time && r.time <= max), unknown: set.filter(r => !r.time) };
}

function renderToday(view, args) {
  const all = liveRecipes();
  const [base, protein, time] = args;

  if (!all.length) {
    view.innerHTML = `
      <div class="page-head"><h1>Wat eten we vandaag?</h1></div>
      ${installBanner()}
      <div class="empty-state">
        <div class="big">📖</div>
        <h2>Jullie kookboek is nog leeg</h2>
        <p>Voeg een paar favoriete recepten toe. Daarna helpt deze pagina je elke dag kiezen.</p>
        <a class="btn primary" href="#/toevoegen">Eerste recept toevoegen</a>
        ${settings.book ? '' : `<p class="hint" style="margin-top:20px">Heeft je partner al recepten? Koppel aan hun kookboek via <a href="#/instellingen">Instellingen</a>.</p>`}
      </div>`;
    return;
  }

  const choiceHTML = (item, n, href, sub) => `
    <a class="choice${n ? '' : ' empty'}" href="${href}" style="text-decoration:none;color:inherit">
      <span class="emoji">${item.emoji}</span><span class="name">${esc(item.label)}</span>
      <span class="count">${sub ? esc(sub) + ' · ' : ''}${n} ${n === 1 ? 'recept' : 'recepten'}</span>
    </a>`;
  const anyHTML = (n, href) => `
    <a class="choice any" href="${href}" style="text-decoration:none;color:inherit">
      <span class="emoji">🤷</span><span class="name">Maakt niet uit</span><span class="count">${n} recepten</span>
    </a>`;
  const labelOf = (list, id) => id === 'alles' ? 'Maakt niet uit' : list[id]?.label || id;
  const crumbs = (...chips) => `<div class="page-head"><button class="back" onclick="history.back()" aria-label="Terug">←</button>
    <div class="crumbs" style="margin:0">${chips.map(c => `<span class="chip on">${esc(c)}</span>`).join('')}</div></div>`;

  if (!base) {
    view.innerHTML = `
      ${installBanner()}
      ${backupBanner()}
      ${todayState.planDay ? planDayBanner() : tonightHTML() + weekStripHTML() + suggestionsHTML(all)}
      <div class="step-label">Vraag 1 van 3</div>
      <h1 class="question">Waar hebben jullie zin in?</h1>
      <div class="choices">
        ${BASES.map(b => choiceHTML(b, wizardSets(b.id).fits.length, `#/vandaag/${b.id}`)).join('')}
        ${anyHTML(all.length, '#/vandaag/alles')}
      </div>
      <a class="pantry-link" href="#/inhuis"><span class="emoji">🧺</span><div><b>Wat heb ik in huis?</b><span>Vul in wat je nog hebt en zie wat je ermee kunt maken.</span></div></a>`;
    return;
  }

  const baseLabel = labelOf(BASE_BY_ID, base);
  const baseSet = wizardSets(base).fits;

  if (!protein) {
    const options = PROTEINS.map(p => [p, baseSet.filter(r => effProteins(r).includes(p.id)).length]).filter(([, n]) => n);
    // Only one possibility: don't ask.
    if (options.length === 1) { location.replace(`#/vandaag/${base}/${options[0][0].id}`); return; }
    view.innerHTML = `
      ${crumbs(baseLabel)}
      ${planDayBanner()}
      <div class="step-label">Vraag 2 van 3</div>
      <h1 class="question">En welk vlees of vis?</h1>
      ${options.length ? `<div class="choices">
        ${options.map(([p, n]) => choiceHTML(p, n, `#/vandaag/${base}/${p.id}`)).join('')}
        ${anyHTML(baseSet.length, `#/vandaag/${base}/alles`)}
      </div>` : `<div class="empty-state"><div class="big">🤔</div><h2>Nog geen recepten met ${esc(baseLabel.toLowerCase())}</h2><p>Kies iets anders of voeg er een toe.</p><a class="btn" href="#/vandaag">Opnieuw kiezen</a></div>`}`;
    return;
  }

  const proteinLabel = labelOf(PROTEIN_BY_ID, protein);
  const set = wizardSets(base, protein).fits;

  if (!time) {
    const timed = set.filter(r => r.time);
    // Nothing to tell apart: every timed recipe is quick, or none has a time.
    if (!timed.length || timed.every(r => r.time <= TIMES[0].max)) { location.replace(`#/vandaag/${base}/${protein}/alles`); return; }
    const unknown = set.length - timed.length;
    view.innerHTML = `
      ${crumbs(baseLabel, proteinLabel)}
      ${planDayBanner()}
      <div class="step-label">Vraag 3 van 3</div>
      <h1 class="question">Hoeveel tijd hebben jullie?</h1>
      <div class="choices">
        ${TIMES.map(t => choiceHTML(t, timed.filter(r => r.time <= t.max).length, `#/vandaag/${base}/${protein}/${t.id}`, t.sub)).join('')}
        ${anyHTML(set.length, `#/vandaag/${base}/${protein}/alles`)}
      </div>
      ${unknown ? `<p class="hint" style="margin-top:14px">${unknown} ${unknown === 1 ? 'recept heeft' : 'recepten hebben'} geen bereidingstijd; die zie je apart onderaan.</p>` : ''}`;
    return;
  }

  const timeLabel = labelOf(TIME_BY_ID, time);
  const { fits, unknown } = wizardSets(base, protein, time);
  const recentCount = [...fits, ...unknown].filter(isRecent).length;
  const everythingRecent = recentCount === fits.length + unknown.length;
  const hide = !todayState.showRecent && recentCount && !everythingRecent;
  const byLeastRecent = (a, b) => (a.lastCooked || 0) - (b.lastCooked || 0);
  const shown = fits.filter(r => !hide || !isRecent(r)).sort(byLeastRecent);
  const shownUnknown = unknown.filter(r => !hide || !isRecent(r)).sort(byLeastRecent);
  const total = shown.length + shownUnknown.length;

  view.innerHTML = `
    ${crumbs(baseLabel, proteinLabel, ...(time === 'alles' ? [] : [timeLabel]))}
    ${planDayBanner()}
    <h1 class="question" style="margin-bottom:6px">${total ? `${total} ${total === 1 ? 'idee' : 'ideeën'} voor vandaag` : 'Geen recepten gevonden'}</h1>
    <p class="hint" style="margin:0 0 16px">${total > 1 ? 'Wat het langst niet op tafel kwam, staat bovenaan.' : ''}
      ${recentCount && !everythingRecent ? `${hide ? `${recentCount} van deze week ${recentCount === 1 ? 'is' : 'zijn'} verborgen.` : ''}
        <a href="javascript:void 0" onclick="todayState.showRecent=${!todayState.showRecent};render()">${hide ? 'Toch tonen' : 'Deze week gegeten verbergen'}</a>` : ''}</p>
    ${total > 1 ? `<button class="btn primary block" style="margin-bottom:16px" onclick="surprise('${esc(base)}','${esc(protein)}','${esc(time)}')">🎲 Kies maar voor ons</button>` : ''}
    <div class="cards">${shown.map(r => photoCardHTML(r)).join('')}</div>
    ${shownUnknown.length ? `<h3 style="margin:22px 0 10px">Tijd onbekend</h3><div class="cards">${shownUnknown.map(r => photoCardHTML(r)).join('')}</div>` : ''}
    <div class="row" style="margin-top:18px"><a class="btn ghost" href="#/vandaag">Opnieuw kiezen</a></div>`;
}

function surprise(base, protein, time) {
  const { fits, unknown } = wizardSets(base, protein, time);
  let set = [...fits, ...unknown];
  if (!todayState.showRecent && set.some(r => !isRecent(r))) set = set.filter(r => !isRecent(r));
  if (!set.length) return;
  // Favour what hasn't been cooked in a while (never cooked counts as 30
  // days), favourites and well-rated dishes.
  const weights = set.map(r => (Math.min(60, r.lastCooked ? (Date.now() - r.lastCooked) / 86400000 : 30) + 1)
    * (r.favorite ? 2 : 1) * (r.rating ? r.rating / 3 : 1));
  let pick = Math.random() * weights.reduce((a, b) => a + b, 0);
  const idx = weights.findIndex(w => (pick -= w) < 0);
  location.hash = `#/recept/${encodeURIComponent(set[Math.max(0, idx)].id)}`;
}

function suggestionsHTML(all) {
  const DAY = 86400000;
  const week = all.filter(isRecent).sort((a, b) => b.lastCooked - a.lastCooked);
  const dayName = (ts) => {
    const d = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / DAY);
    return d === 0 ? 'Vandaag' : d === 1 ? 'Gisteren' : new Date(ts).toLocaleDateString('nl-BE', { weekday: 'long' });
  };
  const favs = all.filter(r => r.favorite && !isRecent(r)).sort((a, b) => (a.lastCooked || 0) - (b.lastCooked || 0)).slice(0, 10);
  const notFav = all.filter(r => !favs.includes(r));
  const longAgo = notFav.filter(r => r.lastCooked && r.lastCooked < Date.now() - 21 * DAY).sort((a, b) => a.lastCooked - b.lastCooked).slice(0, 10);
  const never = notFav.filter(r => !r.lastCooked).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 10);

  let html = '';
  if (week.length) {
    html += `<h3 style="margin-bottom:10px">Deze week gegeten</h3><div class="week-line">${week.map(r =>
      `<a href="#/recept/${encodeURIComponent(r.id)}"><b>${esc(dayName(r.lastCooked))}</b><span>${esc(r.title)}</span></a>`).join('')}</div>`;
  }
  const row = (title, sub, list, label) => list.length ? `<div class="suggest"><h3>${title} <small>${sub}</small></h3>
    <div class="mini-row">${list.map(r => miniCardHTML(r, label(r))).join('')}</div></div>` : '';
  html += row('❤️ Favorieten', 'al een tijdje niet gehad', favs, r => r.lastCooked ? daysAgo(r.lastCooked) : 'nog niet gekookt');
  html += longAgo.length
    ? row('Lang niet meer gemaakt', 'misschien weer eens?', longAgo, r => daysAgo(r.lastCooked))
    : row('Nog nooit gemaakt', 'tijd om te proberen', never, r => r.time ? `⏱ ${r.time} min` : hostOf(r.source) || 'eigen recept');
  return html;
}

function isStandalone() {
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function installBanner() {
  if (isStandalone() || settings.hideInstall) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="banner"><span>📲</span><div><b>Zet Kookboek op je beginscherm</b>
    ${ios ? 'Tik in Safari op het deel-icoon <b style="display:inline">⎙</b> en kies <i>Zet op beginscherm</i>.' : 'Open het menu ⋮ van je browser en kies <i>Toevoegen aan startscherm</i> of <i>App installeren</i>.'}</div>
    <button class="x" onclick="settings.hideInstall=true;saveSettings();render()" aria-label="Sluiten">✕</button></div>`;
}

// ── Recepten (list) ─────────────────────────────────────────────────────────

const listState = { q: '', tags: new Set(), sort: 'az' };

function renderList(view) {
  const tagChips = [{ id: 'fav', emoji: '❤️', label: 'Favorieten' }, ...BASES.filter(b => b.id !== 'anders'), ...PROTEINS.filter(p => p.id !== 'anders')]
    .map(t => `<button class="chip${listState.tags.has(t.id) ? ' on' : ''}" onclick="toggleListTag('${t.id}')">${t.emoji} ${esc(t.label)}</button>`).join('');
  view.innerHTML = `
    <div class="page-head"><h1>Recepten</h1><a class="btn primary" href="#/toevoegen" style="padding:10px 16px;min-height:40px">+ Nieuw</a></div>
    <input class="search" type="search" placeholder="Zoek op naam of ingrediënt…" value="${esc(listState.q)}" oninput="listState.q=this.value;renderListResults()">
    <div class="chips scroll">${tagChips}</div>
    <div class="list-tools"><span class="count" id="list-count"></span>
      <select onchange="listState.sort=this.value;renderListResults()" aria-label="Sorteren">
        <option value="az"${listState.sort === 'az' ? ' selected' : ''}>A–Z</option>
        <option value="new"${listState.sort === 'new' ? ' selected' : ''}>Nieuwste eerst</option>
        <option value="cooked"${listState.sort === 'cooked' ? ' selected' : ''}>Langst niet gekookt</option>
        <option value="rating"${listState.sort === 'rating' ? ' selected' : ''}>Best beoordeeld</option>
      </select></div>
    <div id="list-results"></div>`;
  renderListResults();
}

function toggleListTag(id) {
  listState.tags.has(id) ? listState.tags.delete(id) : listState.tags.add(id);
  renderList($('#view'));
}

function renderListResults() {
  const q = listState.q.trim().toLowerCase();
  let rs = liveRecipes().filter(r => {
    for (const t of listState.tags) {
      if (t === 'fav' ? !r.favorite : BASE_BY_ID[t] ? !effBases(r).includes(t) : !effProteins(r).includes(t)) return false;
    }
    if (!q) return true;
    return (r.title || '').toLowerCase().includes(q) || (r.ingredients || []).some(i => i.toLowerCase().includes(q));
  });
  const sorters = {
    az: (a, b) => (a.title || '').localeCompare(b.title || '', 'nl'),
    new: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
    cooked: (a, b) => (a.lastCooked || 0) - (b.lastCooked || 0),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || (a.title || '').localeCompare(b.title || '', 'nl'),
  };
  rs.sort(sorters[listState.sort]);
  const total = liveRecipes().length;
  $('#list-count').textContent = rs.length === total ? `${total} ${total === 1 ? 'recept' : 'recepten'}` : `${rs.length} van ${total}`;
  $('#list-results').innerHTML = rs.length ? rs.map(recipeItemHTML).join('') :
    total ? `<div class="empty-state"><div class="big">🔍</div><p>Niets gevonden.</p></div>` :
      `<div class="empty-state"><div class="big">📖</div><h2>Nog geen recepten</h2><a class="btn primary" href="#/toevoegen">Recept toevoegen</a></div>`;
}

// ── Recipe detail ───────────────────────────────────────────────────────────

const detailState = { id: null, servings: 0, ticked: new Set(), stepsDone: new Set() };
let wakeLock = null;

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
function releaseWakeLock() { try { wakeLock?.release(); } catch {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (currentRoute() === 'recept' || currentRoute() === 'koken') keepAwake();
    tickTimers();
    scheduleSync(0);
  }
});

function renderDetail(view, id, fresh) {
  const r = recipes.get(id);
  if (!r || r.deleted) {
    view.innerHTML = `<div class="page-head"><button class="back" onclick="history.back()">←</button><h1>Recept niet gevonden</h1></div>
      <p>Dit recept bestaat niet (meer).</p><a class="btn" href="#/recepten">Naar recepten</a>`;
    return;
  }
  if (detailState.id !== id) {
    detailState.id = id;
    detailState.servings = settings.defaultServings || r.servings || 4;
    detailState.ticked = new Set();
    detailState.stepsDone = new Set();
  }
  keepAwake();

  const base = r.servings || 4;
  const factor = detailState.servings / base;
  const tags = [...effBases(r).map(t => BASE_BY_ID[t]), ...effProteins(r).map(t => PROTEIN_BY_ID[t])].filter(t => t && t.id !== 'anders');
  const ingredients = (r.ingredients || []).map((line, i) => isHeading(line)
    ? `<li class="head">${esc(headingText(line))}</li>`
    : `<li class="${detailState.ticked.has(i) ? 'done' : ''}" onclick="tickIngredient(${i})"><span class="box">${detailState.ticked.has(i) ? '✓' : ''}</span><span>${scaleLine(line, factor)}</span></li>`).join('');
  const stepIdx = (r.steps || []).map((s, i) => isHeading(s) ? -1 : i).filter(i => i >= 0);
  const current = stepIdx.find(i => !detailState.stepsDone.has(i));
  const steps = (r.steps || []).map((s, i) => isHeading(s)

// ── Timers ──────────────────────────────────────────────────────────────────
// Durations in step text become buttons. Timers keep an end time, so they
// stay right when the phone sleeps; the alarm sounds as soon as the app is
// in front again (browsers don't run pages in the background).

const DURATION_RE = /(\d+(?:[.,]\d+)?)(?:\s*(?:à|-|–|tot)\s*\d+(?:[.,]\d+)?)?\s*(seconden|sec\b|minuten|minuutjes|minuut|min\b|uur|uren)|(anderhalf\s*uur|half\s*uur|halfuur|kwartier)/gi;

function durationSeconds(m) {
  if (m[3]) return /anderhalf/i.test(m[3]) ? 5400 : /kwartier/i.test(m[3]) ? 900 : 1800;
  const n = parseFloat(m[1].replace(',', '.'));
  const unit = m[2].toLowerCase();
  return Math.round(unit.startsWith('sec') ? n : unit.startsWith('u') ? n * 3600 : n * 60);
}

function stepHTML(text, label) {
  let out = '', last = 0, m;
  DURATION_RE.lastIndex = 0;
  while ((m = DURATION_RE.exec(text))) {
    const secs = durationSeconds(m);
    if (!(secs > 0 && secs <= 86400)) continue;
    out += esc(text.slice(last, m.index)) +
      `<button class="timer-chip" onclick="event.stopPropagation();startTimer(${secs}, ${esc(JSON.stringify(label || 'Timer'))})">⏱ ${esc(m[0])}</button>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

let timers = lsGet('kb_timers', []);
let audioCtx = null, alarmLoop = null, timerKey = '';
const saveTimers = () => lsSet('kb_timers', timers);

function fmtClock(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}
function fmtDuration(s) {
  if (s < 60) return `${s} sec`;
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h} uur${m ? ` ${m} min` : ''}` : `${m} min`;
}

function startTimer(secs, label) {
  // Audio may only start from a tap, so unlock it now for the alarm later.
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  timers.push({ id: newId(), label: `${label} · ${fmtDuration(secs)}`, end: Date.now() + secs * 1000 });
  saveTimers();
  renderTimers();
  toast(`Timer van ${fmtDuration(secs)} gestart`);
}

function stopTimer(id) {
  timers = timers.filter(t => t.id !== id);
  saveTimers();
  if (!timers.some(t => t.done)) stopAlarm();
  renderTimers();
}

function renderTimers() {
  const el = $('#timers');
  document.body.classList.toggle('has-timers', timers.length > 0);
  const key = timers.map(t => t.id + (t.done ? '!' : '')).join();
  if (key !== timerKey) {
    timerKey = key;
    el.innerHTML = timers.map(t => t.done
      ? `<div class="timer-pill done"><span>🔔</span><span class="lbl">${esc(t.label)} — klaar!</span><button onclick="stopTimer('${t.id}')">OK</button></div>`
      : `<div class="timer-pill" data-id="${t.id}"><span class="time"></span><span class="lbl">${esc(t.label)}</span><button onclick="stopTimer('${t.id}')" aria-label="Timer stoppen">✕</button></div>`).join('');
  }
  for (const t of timers) {
    const time = el.querySelector(`[data-id="${t.id}"] .time`);
    if (time) time.textContent = fmtClock(Math.max(0, Math.ceil((t.end - Date.now()) / 1000)));
  }
}

function tickTimers() {
  if (!timers.length) return;
  let fired = false;
  for (const t of timers) {
    if (!t.done && Date.now() >= t.end) { t.done = true; fired = true; notifyTimer(t); }
  }
  if (fired) { saveTimers(); startAlarm(); }
  renderTimers();
}

function notifyTimer(t) {
  if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  navigator.serviceWorker?.ready.then(reg => reg.showNotification('⏱ Timer klaar', { body: t.label, tag: t.id })).catch(() => {});
}

function beep() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  for (const at of [0, 0.25, 0.5]) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, now + at);
    g.gain.exponentialRampToValueAtTime(0.4, now + at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(now + at); o.stop(now + at + 0.22);
  }
}
function startAlarm() {
  if (alarmLoop) return;
  const started = Date.now();
  const ring = () => {
    beep();
    navigator.vibrate?.([300, 150, 300]);
    if (Date.now() - started > 120000) stopAlarm(); // give up after 2 minutes
  };
  ring();
  alarmLoop = setInterval(ring, 1600);
}
function stopAlarm() { clearInterval(alarmLoop); alarmLoop = null; }

// ── Cook mode ───────────────────────────────────────────────────────────────

const UNIT_WORDS = new Set(('g gr gram kg kilo mg ml cl dl l liter deciliter centiliter milliliter el tl eetlepel eetlepels ' +
  'theelepel theelepels snuf snufje scheut scheutje scheutjes blik blikje blikken pak pakje pakken teen teentje teentjes ' +
  'stuk stuks stukje stukjes handje handjes handvol takje takjes tak bosje bosjes bos plak plakken plakje plakjes zakje ' +
  'zakjes potje pot bol bollen stronk stronken kopje kopjes mespunt mespuntje beetje enkele paar klont klontje blaadje ' +
  'blaadjes blad bladeren st x').split(' '));
const STOP_WORDS = new Set(('of en de het een met van voor in op om aan te tot naar bij verse vers gesneden fijngehakte ' +
  'fijngehakt gehakte grote groot kleine klein rode groene gele witte zwarte middelgrote geraspte geraspt kruimige ' +
  'vastkokende bloemige gedroogde gemalen grof fijn extra vergine smaak eventueel evt optioneel ongeveer ca halve hele ' +
  'zachte koude warme lauwe biologische').split(' '));

function ingredientWords(line) {
  const s = line.toLowerCase().replace(QTY_RE, '').replace(/\(.*?\)/g, ' ').split(/[,;]/)[0];
  return s.split(/[^a-zà-ÿ-]+/).filter(w => w && !UNIT_WORDS.has(w) && !STOP_WORDS.has(w) && (w.length >= 3 || w === 'ui'));
}
const stemOf = (w) => w.length > 5 ? w.replace(/(tjes|jes|en|es|s|je)$/, '') : w;
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const mentions = (text, word) => new RegExp('(^|[^a-zà-ÿ])' + escRe(stemOf(word))).test(text);

function ingredientsForStep(r, text) {
  const t = text.toLowerCase();
  // Dutch compounds: "bouillon" in a step should find "kippenbouillon".
  const stepWords = t.split(/[^a-zà-ÿ]+/).filter(w => w.length >= 5).map(stemOf);
  return (r.ingredients || []).filter(l => !isHeading(l) && ingredientWords(l).some(w =>
    mentions(t, w) || stepWords.some(sw => w.length > sw.length && stemOf(w).endsWith(sw))));
}

function cookSteps(r) {
  const out = [];
  let section = '';
  for (const s of r.steps || []) {
    if (isHeading(s)) section = headingText(s);
    else out.push({ text: s, section });
  }
  return out;
}

function renderCook(view, id, idx) {
  const r = recipes.get(id);
  if (!r || r.deleted) { location.replace('#/recepten'); return; }
  if (detailState.id !== id) {
    detailState.id = id;
    detailState.servings = settings.defaultServings || r.servings || 4;
    detailState.ticked = new Set();
    detailState.stepsDone = new Set();
  }
  const steps = cookSteps(r);
  if (!steps.length) { location.replace(`#/recept/${encodeURIComponent(id)}`); return; }
  const i = Math.max(0, Math.min(steps.length - 1, +idx || 0));
  const step = steps[i];
  const factor = detailState.servings / (r.servings || 4);
  const need = ingredientsForStep(r, step.text);
  const last = i === steps.length - 1;
  const to = (n) => `cookGo(${n})`;
  document.body.classList.add('cooking');
  keepAwake();
  cookState.id = id; cookState.i = i; cookState.steps = steps;

  view.innerHTML = `
    <div class="cook">
      <div class="cook-top">
        <button class="back" onclick="stopListening();location.replace('#/recept/${encodeURIComponent(id)}')" aria-label="Kookmodus sluiten">✕</button>
        <div class="title">${esc(r.title)}</div>
        <button class="cook-tool${cookState.read ? ' on' : ''}" onclick="toggleReadAloud()" aria-label="Voorlezen" title="Voorlezen">🔊</button>
        ${SpeechRec ? `<button class="cook-tool${cookState.listening ? ' on' : ''}" onclick="toggleListening()" aria-label="Spraakbediening" title="Spraakbediening">🎙️</button>` : ''}
        <button class="cook-tool" onclick="cycleTextSize()" aria-label="Tekstgrootte" title="Tekstgrootte">A<small>A</small></button>
      </div>
      ${cookState.listening ? `<div class="hint" style="margin:-2px 0 8px">🎙️ Zeg <b>“volgende”</b>, <b>“vorige”</b>, <b>“herhaal”</b> of <b>“timer”</b></div>` : ''}
      <div class="cook-progress"><div style="width:${((i + 1) / steps.length) * 100}%"></div></div>
      <div class="cook-body">
        ${step.section ? `<div class="cook-section">${esc(step.section)}</div>` : ''}
        <div class="cook-stepno">Stap ${i + 1} van ${steps.length} · 👥 ${detailState.servings} personen</div>
        <div class="cook-text">${stepHTML(step.text, `${r.title} — stap ${i + 1}`)}</div>
        ${need.length ? `<div class="cook-need"><h3>Nodig voor deze stap</h3><ul>${need.map(l => `<li>${scaleLine(l, factor)}</li>`).join('')}</ul></div>` : ''}
      </div>
      <div class="cook-nav">
        <button class="btn ghost" ${i ? '' : 'disabled'} onclick="${to(i - 1)}">← Vorige</button>
        ${last ? `<button class="btn primary" onclick="finishCooking('${esc(id)}')">Klaar! 🎉</button>`
          : `<button class="btn primary" onclick="${to(i + 1)}">Volgende →</button>`}
      </div>
    </div>`;
  if (cookState.read && cookState.spokenKey !== id + ':' + i) speakStep();
}

async function finishCooking(id) {
  const r = recipes.get(id);
  if (!(r.lastCooked && startOfDay(r.lastCooked) === startOfDay(Date.now()))) {
    await saveRecipe({ ...r, lastCooked: Date.now(), cookCount: (r.cookCount || 0) + 1 });
  }
  stopListening();
  location.replace(`#/recept/${encodeURIComponent(id)}`);
  // After the hashchange redraw, which would close it otherwise.
  setTimeout(() => openLogSheet(id, true), 60);
}

// Swipe left/right between steps.
let touchX = null, touchY = null;
document.addEventListener('touchstart', e => {
  if (currentRoute() !== 'koken') return;
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (touchX == null || currentRoute() !== 'koken') return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
  const [, id, idx] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const steps = cookSteps(recipes.get(id) || {});
  const next = (+idx || 0) + (dx < 0 ? 1 : -1);
  if (next >= 0 && next < steps.length) location.replace(`#/koken/${encodeURIComponent(id)}/${next}`);
}, { passive: true });

const pantryState = { terms: [] };

function renderPantry(view) {
  const counts = new Map();
  for (const r of liveRecipes()) {
    for (const l of r.ingredients || []) {
      if (isHeading(l)) continue;
      const name = ingredientWords(l).join(' ');
      if (name.length > 1 && name.length < 30) counts.set(name, (counts.get(name) || 0) + 1);
    }
  }
  const known = [...counts].sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 300);
  view.innerHTML = `
    <div class="page-head"><button class="back" onclick="goBack()" aria-label="Terug">←</button><h1>Wat heb ik in huis?</h1></div>
    <p class="hint" style="margin:-8px 0 14px">Voeg toe wat je nog hebt liggen (bv. kip, paprika, room). Recepten die er het meest van gebruiken staan bovenaan.</p>
    <div class="pantry-input">
      <input id="pantry-in" list="pantry-known" placeholder="Ingrediënt…" autocomplete="off" enterkeyhint="done"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addPantryTerm()}">
      <button class="btn primary" style="white-space:nowrap" onclick="addPantryTerm()">Voeg toe</button>
    </div>
    <datalist id="pantry-known">${known.map(k => `<option value="${esc(k)}">`).join('')}</datalist>
    <div class="chips pantry-chips" style="margin-bottom:16px">${pantryState.terms.map((t, i) =>
      `<button class="chip on" onclick="pantryState.terms.splice(${i},1);render()">${esc(t)} ✕</button>`).join('')}</div>
    <div id="pantry-results"></div>`;
  renderPantryResults();
}

function addPantryTerm() {
  const input = $('#pantry-in');
  const terms = input.value.split(/[,;]/).map(s => s.trim().toLowerCase()).filter(Boolean);
  for (const t of terms) if (!pantryState.terms.includes(t)) pantryState.terms.push(t);
  render();
  $('#pantry-in')?.focus();
}

function renderPantryResults() {
  const el = $('#pantry-results');
  const terms = pantryState.terms;
  if (!terms.length) { el.innerHTML = ''; return; }
  const matchesLine = (line, term) => term.split(/\s+/).every(w => mentions(line.toLowerCase(), w));
  const scored = liveRecipes().map(r => {
    const lines = (r.ingredients || []).filter(l => !isHeading(l));
    const hits = terms.filter(t => lines.some(l => matchesLine(l, t)));
    const used = lines.filter(l => terms.some(t => matchesLine(l, t))).length;
    return { r, hits, rest: lines.length - used };
  }).filter(x => x.hits.length)
    .sort((a, b) => b.hits.length - a.hits.length || a.rest - b.rest);
  el.innerHTML = scored.length
    ? `<div class="cards">${scored.map(({ r, hits, rest }) => photoCardHTML(r,
        `<div class="match"><span class="yes">✓ ${esc(hits.join(', '))}</span>${rest ? ` · nog ${rest} ander${rest === 1 ? '' : 'e'} ingrediënt${rest === 1 ? '' : 'en'}` : ''}</div>`)).join('')}</div>`
    : `<div class="empty-state"><div class="big">🧺</div><p>Geen recepten gevonden met ${esc(terms.join(', '))}.</p></div>`;
}

// ── Own copy of imported photos ─────────────────────────────────────────────

async function copyImage(url) {
  if (!url || !/^https?:/i.test(url)) return url;
  try {
    const res = await fetch(`${API}/image?url=${encodeURIComponent(url)}`);
    if (!res.ok) return url;
    return await resizeImage(await res.blob(), 900, 0.75);
  } catch { return url; }
}

// Recipes imported before photos were copied still point at the website.
// Copy them once, in the background, one at a time.
let migratingImages = false;
async function migrateImages() {
  if (migratingImages || !navigator.onLine) return;
  migratingImages = true;
  try {
    for (const r of liveRecipes()) {
      if (!/^https?:/i.test(r.image || '')) continue;
      const copy = await copyImage(r.image);
      const cur = recipes.get(r.id);
      if (copy.startsWith('data:') && cur && !cur.deleted && cur.image === r.image) await saveRecipe({ ...cur, image: copy });
    }
  } finally { migratingImages = false; }
}
