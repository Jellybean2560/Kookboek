const BACKUP_NAG_DAYS = 30;

function backupBanner() {
  // A shared book is backed up daily on the server; only nag otherwise.
  const n = liveRecipes().length;
  const due = Date.now() - Math.max(settings.lastExport, settings.backupNagAt) > BACKUP_NAG_DAYS * 86400000;
  if (settings.book || n < 3 || !due) return '';
  return `<div class="banner"><span>💾</span><div><b>Tijd voor een back-up</b>
    Je ${n} recepten staan alleen op dit toestel. <a href="javascript:void 0" onclick="exportBackup()">Nu opslaan</a>
    of maak een gedeeld kookboek in Instellingen — dat wordt elke dag automatisch bewaard.</div>
    <button class="x" onclick="settings.backupNagAt=Date.now();saveSettings();render()" aria-label="Later">✕</button></div>`;
}

async function loadSnapshots() {
  const el = $('#snapshots');
  if (!el || !settings.book) return;
  try {
    const res = await fetch(`${API}/b/${encodeURIComponent(settings.book)}/snapshots`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const list = data.snapshots || [];
    el.innerHTML = list.length ? list.map(s => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
        <span style="flex:1">${new Date(s.created).toLocaleString('nl-BE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}<br>
          <span class="hint" style="margin:0">${s.count} recepten</span></span>
        <button class="btn ghost" style="min-height:38px;padding:8px 14px" onclick="restoreSnapshot(${s.id})">Terugzetten</button>
      </div>`).join('')
      : '<p class="hint" style="margin:0">Nog geen back-ups. De eerste wordt gemaakt bij de eerste wijziging van morgen.</p>';
  } catch {
    el.innerHTML = '<p class="hint" style="margin:0">Back-ups konden niet geladen worden (geen verbinding?).</p>';
  }
}

async function restoreSnapshot(id) {
  if (!confirm('Alle recepten terugzetten zoals ze toen waren? Recepten die later zijn toegevoegd blijven staan.')) return;
  try {
    const res = await fetch(`${API}/b/${encodeURIComponent(settings.book)}/snapshots/${id}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    // Only recipes: an old shopping list shouldn't come back with them.
    for (const r of data.recipes.filter(d => !d.kind)) {
      const { deleted, deletedAt, ...rest } = r;
      await saveRecipe(rest);
    }
    toast(`${data.recipes.length} recepten teruggezet`);
    render();
  } catch (e) {
    toast('Terugzetten lukte niet: ' + (e.message || 'geen verbinding'));
  }
}

// ── Boodschappenlijst ───────────────────────────────────────────────────────
// Adding a recipe creates a 'plan' doc plus one 'item' doc per ingredient
// line. Items keep the recipe's original line; the quantity is scaled to the
// plan's servings when the list is drawn, so changing servings rewrites
// nothing. Lines for the same product are added up for display.

const CG_SEARCH = 'https://www.collectandgo.be/nl/zoek?searchTerm=';

// Units that can be added up, as [base unit, multiplier].
const UNIT_BASE = {
  g: ['g', 1], gr: ['g', 1], gram: ['g', 1], grammen: ['g', 1], kg: ['g', 1000], kilo: ['g', 1000], kilogram: ['g', 1000],
  ml: ['ml', 1], milliliter: ['ml', 1], cl: ['ml', 10], centiliter: ['ml', 10], dl: ['ml', 100], deciliter: ['ml', 100],
  l: ['ml', 1000], liter: ['ml', 1000],
  el: ['el', 1], eetlepel: ['el', 1], eetlepels: ['el', 1], tl: ['tl', 1], theelepel: ['tl', 1], theelepels: ['tl', 1],
};

// Things most kitchens have; listed separately so they don't clutter the list.
const STAPLES = ['zout', 'peper', 'olie', 'olijfolie', 'zonnebloemolie', 'arachideolie', 'water', 'kraantjeswater',
  'suiker', 'bloem', 'bakpoeder', 'maizena', 'azijn', 'ijsblokjes', 'zeezout', 'tafelzout'];

const SYNONYMS = { ajuin: 'ui', ajuinen: 'ui', uien: 'ui', look: 'knoflook', hesp: 'ham', 'selder': 'selderij' };

const planFor = (recipeId) => liveDocs('plan').find(p => p.recipeId === recipeId);

// day: 'YYYY-MM-DD' to put it on the week menu, or null for "just shopping".
async function addPlan(recipeId, servings, day = null) {
  const r = recipes.get(recipeId);
  if (!r) return;
  const existing = planFor(recipeId);
  if (existing) {
    if (day !== undefined && existing.day !== day) await saveRecipe({ ...existing, day });
    return;
  }
  const plan = { id: 'plan-' + newId(), kind: 'plan', recipeId, day, servings: servings || settings.defaultServings || r.servings || 4, createdAt: Date.now() };
  await saveRecipe(plan);
  let order = 0;
  for (const line of r.ingredients || []) {
    if (isHeading(line) || !line.trim()) continue;
    await saveRecipe({ id: 'item-' + newId(), kind: 'item', planId: plan.id, recipeId, line, order: order++, checked: false, createdAt: Date.now() });
  }
  updateListBadge();
}

async function removePlan(planId, silent) {
  const plan = recipes.get(planId);
  if (!plan) return;
  const items = liveDocs('item').filter(i => i.planId === planId);
  for (const doc of [plan, ...items]) await saveRecipe({ id: doc.id, kind: doc.kind, deleted: true });
  if (!silent) {
    const title = recipes.get(plan.recipeId)?.title || 'Recept';
    toast(`${title} van de lijst gehaald`, {
      label: 'Ongedaan maken',
      run: async () => { for (const doc of [plan, ...items]) await saveRecipe({ ...doc }); render(); },
    });
  }
  render();
}

async function setPlanServings(planId, delta) {
  const plan = recipes.get(planId);
  await saveRecipe({ ...plan, servings: Math.max(1, Math.min(40, plan.servings + delta)) });
  render();
}

async function addManualItems() {
  const input = $('#shop-in');
  const lines = input.value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  for (const line of lines) {
    await saveRecipe({ id: 'item-' + newId(), kind: 'item', line, manual: true, checked: false, createdAt: Date.now() });
  }
  input.value = '';
  render();
  $('#shop-in')?.focus();
}

// Splits "2 el olijfolie (extra vergine)" into quantity, unit and product.
function parseLine(line) {
  const m = line.match(QTY_RE);
  let qty = null, rest = line;
  if (m && Number.isFinite(parseNum(m[2]))) { qty = parseNum(m[2]); rest = line.slice(m[0].length); }
  rest = rest.trim();
  const word = (rest.match(/^[a-zà-ÿ.]+/i) || [''])[0];
  const w = word.toLowerCase().replace(/\.$/, '');
  let unit = '', unitWord = '', base = null;
  if (qty != null && UNIT_BASE[w]) { base = UNIT_BASE[w]; unit = base[0]; unitWord = word; rest = rest.slice(word.length).trim(); }
  else if (qty != null && UNIT_WORDS.has(w)) { unit = w.replace(/(tjes|jes|je|ken|en|s)$/, ''); unitWord = word; rest = rest.slice(word.length).trim(); }
  const name = rest.replace(/^(van|de|het)\s+/i, '').trim() || line.trim();
  const words = ingredientWords(name);
  // Crude Dutch singular so "1 ui" and "3 uien" end up on one line, and the
  // Flemish "ajuin" with them.
  const key = (words.length ? words : [name.toLowerCase()])
    .map(x => SYNONYMS[x] || (x.length > 3 ? x.replace(/(en|s)$/, '') : x)).join(' ');
  return { qty, unit, unitWord, mult: base ? base[1] : 1, name, key, search: words.join(' ') || name };
}

// Adds up quantities per kind of unit: "500 g + 1 blik" when they can't be
// combined. Lines without a quantity ("zout") add nothing.
function formatTotal(members) {
  const byUnit = new Map();
  for (const m of members.filter(m => m.qty != null)) {
    if (!byUnit.has(m.unit)) byUnit.set(m.unit, []);
    byUnit.get(m.unit).push(m);
  }
  return [...byUnit.values()].map(list => {
    const first = list[0];
    // All in the same unit word (e.g. all "deciliter"): keep that unit.
    if (list.every(m => m.unitWord.toLowerCase() === first.unitWord.toLowerCase())) {
      let n = list.reduce((s, m) => s + m.qty, 0);
      // You can't buy 1½ onion or half a tin: round pieces up.
      if (!['g', 'ml', 'el', 'tl'].includes(first.unit)) n = Math.ceil(n - 1e-9);
      return `${formatQty(n, ' ' + first.unitWord)}${first.unitWord ? ' ' + first.unitWord : ''}`;
    }
    const n = list.reduce((s, m) => s + m.qty * m.mult, 0);
    if (first.unit === 'g') return n >= 1000 ? `${decimal(n / 1000, 2)} kg` : `${formatQty(n, ' g')} g`;
    if (first.unit === 'ml') return n >= 1000 ? `${decimal(n / 1000, 2)} l` : `${formatQty(n, ' ml')} ml`;
    return `${formatQty(n, '')} ${first.unitWord}`.trim();
  }).join(' + ');
}

// Supermarket sections, so the list follows the shop instead of the recipes.
// Checked in this order: "kippenbouillon" is a jar, not meat, and
// "tomatenblokjes" a tin, not fresh vegetables.
const AISLES = [
  { id: 'kruiden', label: '🧂 Kruiden & specerijen', words: ['zout', 'peper', 'kruiden', 'paprikapoeder', 'kurkuma', 'curry', 'komijn', 'oregano', 'kaneel', 'nootmuskaat', 'laurier', 'tijm', 'rozemarijn', 'chilipoeder', 'sesamza', 'specerij', 'vanille', 'saffraan', 'kerrie'] },

  { id: 'zuivel', label: '🧀 Zuivel & eieren', words: ['melk', 'room', 'boter', 'kaas', 'yoghurt', 'ei', 'eieren', 'mascarpone', 'mozzarella', 'parmezaan', 'parmigiano', 'feta', 'crème', 'creme', 'ricotta', 'emmental', 'gruyère', 'cheddar', 'kwark'] },
  { id: 'brood', label: '🥖 Brood & bakkerij', words: ['brood', 'wrap', 'tortilla', 'pistolet', 'naan', 'pita', 'baguette', 'ciabatta', 'bladerdeeg', 'deeg', 'beschuit', 'toast', 'bun'] },
  { id: 'groenten', label: '🥬 Groenten & fruit', words: ['ui', 'uien', 'ajuin', 'sjalot', 'knoflook', 'tomaat', 'tomaten', 'paprika', 'champignon', 'wortel', 'prei', 'courgette', 'aubergine', 'broccoli', 'bloemkool', 'spinazie', 'sla', 'rucola', 'komkommer', 'peultje', 'boon', 'bonen', 'haricots', 'erwt', 'mais', 'aardappel', 'kriel', 'appel', 'citroen', 'limoen', 'sinaas', 'banaan', 'peer', 'avocado', 'gember', 'peterselie', 'koriander', 'basilicum', 'munt', 'bieslook', 'dille', 'boksoi', 'bimi', 'pompoen', 'selder', 'venkel', 'radijs', 'kool', 'witloof', 'asperge', 'lente-ui', 'bosui', 'chilipeper', 'groente', 'fruit', 'bes', 'aardbei', 'druif', 'mango', 'ananas', 'pastinaak', 'biet', 'kervel', 'waterkers'] },
];
const AISLE_ORDER = ['groenten', 'vlees', 'zuivel', 'brood', 'droog', 'kruiden', 'overig'];
const AISLE_LABEL = Object.fromEntries([...AISLES.map(a => [a.id, a.label]), ['overig', '🛒 Overige']]);

function aisleOf(name) {
  const t = name.toLowerCase();
  // Long words may sit inside a compound ("kippenbouillon"); short ones
  // must start a word ("ui" is not in "fruit").
  const hit = (w) => w.length >= 5 ? t.includes(w) : new RegExp('(^|[^a-zà-ÿ])' + escRe(w)).test(t);
  return AISLES.find(a => a.words.some(hit))?.id || 'overig';
}

// Groups items by product (and compatible unit) and scales recipe lines.
function shoppingLines() {
  const plans = new Map(liveDocs('plan').map(p => [p.id, p]));
  const groups = new Map();
  for (const it of liveDocs('item')) {
    const plan = plans.get(it.planId);
    if (!it.manual && !plan) continue; // plan was removed on another phone
    const r = plan ? recipes.get(plan.recipeId) : null;
    const p = parseLine(it.line);
    if (p.qty != null && plan) p.qty *= plan.servings / (r?.servings || 4);
    const gk = p.key;
    // The unit word counts for the aisle: "blik tomaten" is a tin, not fresh.
    if (!groups.has(gk)) groups.set(gk, { key: gk, name: p.name, search: p.search, aisle: aisleOf(`${p.unitWord} ${p.name}`), members: [], items: [], from: new Set() });
    const g = groups.get(gk);
    g.items.push(it);
    if (!it.checked) g.members.push(p);
    if (r) g.from.add(r.title);
    else if (it.from) g.from.add(it.from);
  }
  return [...groups.values()].map(g => {
    const done = g.items.every(i => i.checked);
    const shown = done ? g.items.map(i => parseLine(i.line)) : g.members;
    const staple = STAPLES.includes(g.search.split(' ')[0]);
    return { ...g, done, staple, total: formatTotal(shown) };
  }).sort((a, b) => AISLE_ORDER.indexOf(a.aisle) - AISLE_ORDER.indexOf(b.aisle) || a.name.localeCompare(b.name, 'nl'));
}

async function toggleShopLine(key) {
  const line = shoppingLines().find(l => l.key === key);
  if (!line) return;
  const to = !line.done;

  render();
}

// Swipe a list line right to tick it off (left to untick).
let swipe = null;
document.addEventListener('touchstart', e => {
  const li = e.target.closest?.('.shop li[data-key]');
  if (!li || e.target.closest('a, button')) { swipe = null; return; }
  swipe = { li, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, horizontal: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!swipe) return;
  const dx = e.touches[0].clientX - swipe.x, dy = e.touches[0].clientY - swipe.y;
  if (swipe.horizontal === null && Math.abs(dx) + Math.abs(dy) > 10) swipe.horizontal = Math.abs(dx) > Math.abs(dy);
  if (!swipe.horizontal) return;
  e.preventDefault();
  const done = swipe.li.classList.contains('done');
  swipe.dx = done ? Math.min(0, Math.max(-140, dx)) : Math.max(0, Math.min(140, dx));
  swipe.li.style.transform = `translateX(${swipe.dx}px)`;
  swipe.li.classList.toggle('swiping', Math.abs(swipe.dx) > 70);
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!swipe) return;
  const { li, dx } = swipe;
  swipe = null;
  li.style.transform = '';
  li.classList.remove('swiping');
  if (Math.abs(dx) > 70) {
    navigator.vibrate?.(15);
    toggleShopLine(li.dataset.key);
  }
});

function dayKey(offset = 0) {
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const keyDate = (key) => new Date(key + 'T12:00:00');
function dayLabel(key, long = false) {
  const diff = Math.round((keyDate(key) - keyDate(dayKey())) / 86400000);
  if (diff === 0) return 'Vandaag';
  if (diff === 1) return 'Morgen';
  if (diff === -1) return 'Gisteren';
  const d = keyDate(key);
  return long || diff < 0 || diff > 6
    ? d.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'short' })
    : d.toLocaleDateString('nl-BE', { weekday: 'long' });
}
const plansOn = (key) => liveDocs('plan').filter(p => p.day === key && recipes.get(p.recipeId) && !recipes.get(p.recipeId).deleted);

function planBarHTML(r) {

  }
  if (plan) {
    return `<div class="cooked-bar" style="background:var(--surface-2)">📅 <span style="flex:1">${plan.day ? `Gepland voor <b>${esc(dayLabel(plan.day).toLowerCase())}</b>` : 'Op de boodschappenlijst'} · ${plan.servings} pers.</span>
      <button class="btn ghost" style="min-height:36px;padding:6px 12px" onclick="openPlanSheet('${esc(r.id)}')">Wijzig</button></div>`;

  return `<button class="btn ghost block" style="margin:-4px 0 16px" onclick="openPlanSheet('${esc(r.id)}')">📅 Inplannen / op de boodschappenlijst</button>`;

// ── Handsfree cooking ───────────────────────────────────────────────────────

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const cookState = { id: null, i: 0, steps: [], read: false, listening: false, spokenKey: '' };
let recognizer = null;

function cookGo(n) {
  if (n < 0 || n >= cookState.steps.length) return;
  location.replace(`#/koken/${encodeURIComponent(cookState.id)}/${n}`);
}

function speak(text, after) {
  if (!('speechSynthesis' in window)) { toast('Voorlezen wordt niet ondersteund op dit toestel'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  u.voice = voices.find(v => v.lang === 'nl-BE') || voices.find(v => v.lang?.startsWith('nl')) || null;
  u.lang = u.voice?.lang || 'nl-BE';
  u.rate = 0.95;
  // Don't let the microphone hear the app talking.
  u.onstart = () => { if (recognizer) try { recognizer.abort(); } catch {} };
  u.onend = () => { if (cookState.listening) startRecognizer(); after?.(); };
  speechSynthesis.speak(u);
}

function speakStep() {
  const step = cookState.steps[cookState.i];
  if (!step) return;
  cookState.spokenKey = cookState.id + ':' + cookState.i;
  speak(`Stap ${cookState.i + 1}. ${step.text}`);
}

function toggleReadAloud() {
  cookState.read = !cookState.read;
  if (cookState.read) speakStep(); else speechSynthesis?.cancel();
  render();
}

function toggleListening() {
  if (cookState.listening) { stopListening(); render(); return; }
  cookState.listening = true;
  startRecognizer();
  render();
}

function startRecognizer() {
  if (!SpeechRec || !cookState.listening || currentRoute() !== 'koken') return;
  try { recognizer?.abort(); } catch {}
  recognizer = new SpeechRec();
  recognizer.lang = 'nl-BE';
  recognizer.continuous = true;
  recognizer.interimResults = false;
  recognizer.onresult = (e) => {
    const said = e.results[e.results.length - 1][0].transcript.toLowerCase();
    if (/volgende|verder|next/.test(said)) cookGo(cookState.i + 1);
    else if (/vorige|terug/.test(said)) cookGo(cookState.i - 1);
    else if (/herhaal|opnieuw|lees|nog eens/.test(said)) speakStep();
    else if (/timer|wekker|start/.test(said)) document.querySelector('.cook-text .timer-chip')?.click();
    else if (/klaar|stop/.test(said) && cookState.i === cookState.steps.length - 1) finishCooking(cookState.id);
  };
  recognizer.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      cookState.listening = false;
      toast('Geen toegang tot de microfoon');
      render();
    }
  };
  // Browsers stop listening after a while; keep it going while it's on.
  recognizer.onend = () => { if (cookState.listening && !speechSynthesis?.speaking) setTimeout(startRecognizer, 300); };
  try { recognizer.start(); } catch {}
}

function stopListening() {
  cookState.listening = false;
  try { recognizer?.abort(); } catch {}
  recognizer = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

const TEXT_SIZES = [[1, 'Normaal'], [1.15, 'Groot'], [1.3, 'Extra groot']];
function applyTextSize() { document.documentElement.style.setProperty('--scale', settings.textScale || 1); }
function cycleTextSize() {
  const i = TEXT_SIZES.findIndex(([s]) => s === (settings.textScale || 1));

}

// ── AI help ─────────────────────────────────────────────────────────────────

const recipePayload = (r) => ({ title: r.title, servings: r.servings, ingredients: (r.ingredients || []).filter(l => !isHeading(l)), steps: (r.steps || []).filter(s => !isHeading(s)) });

async function aiPost(path, body) {
  const res = await fetch(`${API}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fout ${res.status}`);
  return data;
}

// Lets the AI pick categories and fill a missing time for a new draft. The
// keyword guess stays as a fallback if it's offline or out of budget.
async function classifyDraft(d) {
  if (!navigator.onLine || !(d.title || d.ingredients?.length)) return;
  const note = () => $('#ai-note');
  if (note()) note().innerHTML = '<span class="spinner" style="display:inline-block;width:12px;height:12px;vertical-align:-1px"></span> AI kiest de categorieën…';
  try {
    const out = await aiPost('/classify', { recipe: recipePayload(d) });
    if (draft !== d) return; // the form was closed or replaced meanwhile
    if (out.bases?.length) d.bases = out.bases;
    if (out.proteins?.length) d.proteins = out.proteins;
    if (!d.time && out.time) d.time = out.time;
    d.aiTagged = true;
    refreshDraftTags();
    if (note()) note().textContent = '✨ Categorieën gekozen door AI — pas ze gerust aan.';
  } catch (e) {
    if (note()) note().textContent = '';
  }
}

function refreshDraftTags() {
  const chips = (list, key) => list.map(t =>
    `<button type="button" class="chip${draft[key].includes(t.id) ? ' on' : ''}" onclick="toggleDraftTag('${key}','${t.id}',this)">${t.emoji} ${esc(t.label)}</button>`).join('');
  if ($('#f-bases')) $('#f-bases').innerHTML = chips(BASES, 'bases');
  if ($('#f-proteins')) $('#f-proteins').innerHTML = chips(PROTEINS, 'proteins');
  if ($('#f-time') && draft.time && !$('#f-time').value) $('#f-time').value = draft.time;
}

async function askAssist(id, mode, btn) {
  const r = recipes.get(id);
  const label = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Even denken…';
  try {
    const out = await aiPost('/assist', { mode, recipe: { ...recipePayload(r), servings: detailState.servings } });
    if (mode === 'vega') showVegaSheet(r, out); else showSideSheet(r, out.suggestions);
  } catch (e) {
    toast(!navigator.onLine ? 'Geen verbinding' : e.message);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

let assistResult = null;
function showVegaSheet(r, v) {
  assistResult = { r, v };
  openSheet(`
    <h2 style="margin-bottom:4px">🥦 ${esc(v.title || r.title + ' (vegetarisch)')}</h2>
    <p class="hint" style="margin:0 0 12px">${esc(v.intro || '')} Voor ${detailState.servings} personen · voorstel van AI, kijk het na.</p>
    <h3>Ingrediënten</h3><ul class="sheet-list">${v.ingredients.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
    <h3 style="margin-top:12px">Bereiding</h3><ol class="sheet-list">${v.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" onclick="closeSheet()">Sluiten</button>
      <button class="btn primary" onclick="saveVegaVersion()">Opslaan als recept</button>
    </div>`);
}

function saveVegaVersion() {
  const { r, v } = assistResult;
  closeSheet();
  startDraft({
    title: v.title || `${r.title} (vegetarisch)`, image: r.image, servings: detailState.servings, time: r.time,
    ingredients: v.ingredients, steps: v.steps, bases: [...(r.bases || [])], proteins: ['vega'],
    notes: `Vegetarische versie van "${r.title}", voorgesteld door AI.`, imported: true,
  });
}

function showSideSheet(r, list) {
  assistResult = { r, list };
  openSheet(`
    <h2 style="margin-bottom:4px">🍽️ Past bij ${esc(r.title)}</h2>
    <p class="hint" style="margin:0 0 12px">Voorstellen van AI voor ${detailState.servings} personen.</p>

function recipeAsText(r, servings) {
  const factor = servings / (r.servings || 4);
  const plain = (html) => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; };
  const ing = (r.ingredients || []).map(l => isHeading(l) ? `\n${headingText(l)}:` : `• ${plain(scaleLine(l, factor))}`).join('\n');
  let n = 0;
  const steps = (r.steps || []).map(s => isHeading(s) ? `\n${headingText(s)}:` : `${++n}. ${s}`).join('\n');
  return `${r.title}\n(${servings} personen${r.time ? `, ${r.time} min` : ''})\n\nIngrediënten\n${ing}\n\nBereiding\n${steps}${r.source ? `\n\nBron: ${r.source}` : ''}`;
}

}

const MAX_SCAN_PAGES = 4;
let scanPages = [];

function renderScanPages() {
  const el = $('#scan-pages');
  if (!el) return;
  const pick = (label, capture, cls) => `<label class="btn ${cls}" style="flex:1;padding:12px 10px;white-space:nowrap">${label}
    <input type="file" accept="image/*" ${capture ? 'capture="environment"' : 'multiple'} hidden onchange="addScanPages(this)"></label>`;
  el.innerHTML = scanPages.length ? `
    <div class="scan-pages">
      ${scanPages.map((src, i) => `<div class="scan-page"><img src="${src}" alt="Pagina ${i + 1}"><button onclick="removeScanPage(${i})" aria-label="Verwijderen">✕</button></div>`).join('')}
    </div>
    <div class="row" style="margin-bottom:10px">
      ${scanPages.length < MAX_SCAN_PAGES ? pick('📷 Pagina erbij', true, 'ghost') + pick('🖼️ Uit galerij', false, 'ghost') : ''}
    </div>
    <button class="btn primary block" id="scan-btn" onclick="scanRecipe()">Recept lezen</button>`
    : `<div class="row">${pick('📷 Foto maken', true, 'primary')}${pick('🖼️ Uit galerij', false, '')}</div>`;
}

async function addScanPages(input) {
  const files = [...(input.files || [])].slice(0, MAX_SCAN_PAGES - scanPages.length);
  input.value = '';
  for (const f of files) {
    try { scanPages.push(await resizeImage(f, 1600, 0.82)); }
    catch { toast('Deze foto kon niet gelezen worden'); }
  }
  $('#scan-msg').textContent = '';
  renderScanPages();
}

function removeScanPage(i) {
  scanPages.splice(i, 1);
  renderScanPages();
}

function resizeImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

async function scanRecipe() {
  if (!scanPages.length) return;
  const btn = $('#scan-btn'), msg = $('#scan-msg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Recept lezen… (±10 sec)';
  msg.textContent = '';
  try {
    const res = await fetch(`${API}/scan`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images: scanPages }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Fout ${res.status}`);
    scanPages = [];
    startDraft({ ...data, imported: true, scanned: true, partial: !(data.ingredients?.length && data.steps?.length) });
  } catch (e) {
    const offline = !navigator.onLine || e instanceof TypeError;
    msg.innerHTML = `<span style="color:var(--danger)">${esc(offline ? 'Geen verbinding. Probeer het opnieuw als je online bent.' : e.message)}</span>`;
    if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Recept lezen'; }
  }
}

async function pasteUrl() {
  try {
    const t = await navigator.clipboard.readText();
    const url = (t.match(/https?:\/\/\S+/) || [t])[0].trim();
    $('#import-url').value = url;
    if (/^https?:\/\//.test(url)) importFromUrl();
  } catch { toast('Plakken lukte niet — houd het veld ingedrukt en kies Plakken'); }
}

async function importFromUrl(urlArg) {
  const input = $('#import-url');
  let url = (urlArg || input?.value || '').trim();
  if (!url) { input?.focus(); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const existing = liveRecipes().find(r => r.source && r.source.replace(/[#?].*$/, '') === url.replace(/[#?].*$/, ''));
  if (existing && !confirm(`"${existing.title}" staat al in jullie kookboek. Toch opnieuw importeren?`)) {
    location.hash = `#/recept/${encodeURIComponent(existing.id)}`;
    return;
  }
  const btn = $('#import-btn'), msg = $('#import-msg');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Ophalen…'; }
  try {
    const res = await fetch(`${API}/import?url=${encodeURIComponent(url)}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Fout ${res.status}`);
    if (btn) btn.innerHTML = '<span class="spinner"></span> Foto bewaren…';
    // Keep our own copy so the photo works offline and survives the site.
    const image = await copyImage(data.image);
    startDraft({
      title: data.title, image, source: data.source || url,
      servings: data.servings, time: data.time,
      ingredients: data.ingredients, steps: data.steps,
      notes: '', imported: true, partial: data.partial,
    });
  } catch (e) {
    const offline = !navigator.onLine || e instanceof TypeError;
    const text = offline ? 'Geen verbinding. Probeer het opnieuw als je online bent.'
      : `${e.message}. Probeer de tekst te kopiëren en hieronder te plakken.`;
    if (msg) { msg.innerHTML = `<span style="color:var(--danger)">${esc(text)}</span>`; }
    else toast(text);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Recept ophalen'; }
  }
}

function importFromText() {
  const text = $('#import-text').value.trim();
  if (!text) { $('#import-text').focus(); return; }
  startDraft({ ...parseRecipeText(text), imported: true });
}

// Turns pasted recipe text into fields. Looks for "Ingrediënten" and
// "Bereiding"-style headings; without them, lines that start with a quantity
// count as ingredients and longer sentences as steps.
function parseRecipeText(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const ingHead = /^(ingredi[eë]nten|benodigdheden|boodschappen|wat heb je nodig|nodig)\b/i;
  const stepHead = /^(bereiding(swijze)?|werkwijze|instructies|zo maak je het|aan de slag|bereiden|recept)\b\s*:?$/i;
  const url = (text.match(/https?:\/\/\S+/) || [''])[0];
  const servings = +(text.match(/(\d+)\s*(personen|pers\b|porties|persons|servings)/i) || [])[1] || null;
  const time = +(text.match(/(\d+)\s*(min\b|minuten|minutes)/i) || [])[1] || null;
  const iI = lines.findIndex(l => ingHead.test(l));
  const iS = lines.findIndex((l, i) => i > iI && stepHead.test(l));
  const stripNum = (s) => s.replace(/^(stap\s*)?\d+[.)]\s*/i, '');
  let title = lines[0] || '', ingredients = [], steps = [];
  if (iI >= 0) {
    if (iI === 0) title = '';
    ingredients = lines.slice(iI + 1, iS > iI ? iS : undefined).filter(l => l.length < 120);
    steps = iS > iI ? lines.slice(iS + 1).map(stripNum).filter(l => l.length > 15) : [];
  } else {
    for (const l of lines.slice(1)) {
      if (QTY_RE.test(l) && l.length < 80 && !/^\d+[.)]\s/.test(l)) ingredients.push(l);
      else if (l.length > 30) steps.push(stripNum(l));
    }
  }
  return { title, source: url, servings, time, ingredients, steps, notes: '' };
}

function startDraft(d) {
  draft = {
    id: '', title: '', image: '', source: '', servings: null, time: null,
    ingredients: [], steps: [], notes: '', ...d,
  };
  if (!d.bases && !d.proteins && (draft.title || draft.ingredients.length)) Object.assign(draft, guessTags(draft.title, draft.ingredients));
  if (!draft.bases) draft.bases = [];
  if (!draft.proteins) draft.proteins = [];
  if (location.hash === '#/bewerk/nieuw') render(); else location.hash = '#/bewerk/nieuw';
  if (d.imported && !d.bases) setTimeout(() => classifyDraft(draft), 0);
}

function toggleDraftTag(key, id, el) {
  const list = draft[key];
  const i = list.indexOf(id);
  i >= 0 ? list.splice(i, 1) : list.push(id);

async function pickPhoto(input) {

  if (!file) return;

function cancelEdit() {
  const wasNew = !draft?.id;
  const id = draft?.id;
  draft = null;
  if (wasNew) location.replace('#/toevoegen');
  else location.replace(`#/recept/${encodeURIComponent(id)}`);
}

async function saveDraft() {
  const d = draft;
  if (!d.title.trim()) { toast('Geef het recept een naam'); $('#f-title').focus(); return; }
  const prev = d.id ? recipes.get(d.id) : null;
  const r = {
    ...prev, // keeps favourite, rating and cooking history
    id: d.id || newId(),
    createdAt: prev?.createdAt || Date.now(),
    title: d.title.trim(), image: d.image || '', source: d.source || '',
    servings: d.servings || null, time: d.time || null,
    bases: d.bases, proteins: d.proteins,
    ingredients: d.ingredients, steps: d.steps, notes: (d.notes || '').trim(),
    lastCooked: prev?.lastCooked || null, cookCount: prev?.cookCount || 0,
  };
  await saveRecipe(r);
  draft = null;
  if (detailState.id === r.id) detailState.id = null;
  toast(prev ? 'Opgeslagen' : 'Recept toegevoegd 🎉');
  location.replace(`#/recept/${encodeURIComponent(r.id)}`);
}

          <button class="btn ghost" style="min-height:38px;padding:8px 14px" onclick="restoreRecipe('${esc(r.id)}').then(()=>{toast('Teruggezet');render()})">Terugzetten</button>
        </div>`).join('')}
    </div>` : ''}

    <div class="card">
      <h2>📲 Installeren</h2>
      <p style="margin:0">${isStandalone() ? 'Kookboek is geïnstalleerd. 👍' : '<b>iPhone:</b> open deze pagina in Safari → deel-icoon → <i>Zet op beginscherm</i>.<br><b>Android:</b> Chrome → menu ⋮ → <i>App installeren</i> of <i>Toevoegen aan startscherm</i>.'}</p>
    </div>`;
  loadSnapshots();
}

async function createBook() {
  await joinBook(makeBookCode());
}
function joinFromInput() {
  const code = normaliseCode($('#join-code').value);
  if (code.replace(/-/g, '').length < 8) { toast('Die code is te kort'); return; }
  joinBook(code);
}
async function shareBook() {
  const link = `${location.origin}${location.pathname}#/koppel/${settings.book}`;
  const text = `Kook je mee? Open deze link om ons gedeelde kookboek te koppelen: ${link}\n(of vul de code ${settings.book} in bij Instellingen)`;
  if (navigator.share) { try { await navigator.share({ title: 'Ons kookboek', text }); } catch {} }
  else { try { await navigator.clipboard.writeText(text); toast('Uitnodiging gekopieerd'); } catch {} }
}
function leaveBook() {
  if (!confirm('Ontkoppelen? De recepten blijven op dit toestel staan, maar wijzigingen worden niet meer gedeeld.')) return;
  settings.book = ''; settings.seq = 0; settings.lastSync = 0; saveSettings();
  dirty.clear(); saveDirty();
  render();
}

function renderJoin(view, code) {
  code = normaliseCode(code || '');
  if (settings.book === code) { location.replace('#/instellingen'); return; }
  view.innerHTML = `
    <div class="page-head"><h1>Kookboek koppelen</h1></div>
    <div class="card">
      <h2>Je bent uitgenodigd 👩‍🍳</h2>
      <p>Koppel dit toestel aan het gedeelde kookboek <b>${esc(code)}</b>. ${liveRecipes().length ? 'Je eigen recepten worden erbij gezet.' : ''}
      ${settings.book ? `<br><br>Let op: je bent nu gekoppeld aan <b>${esc(settings.book)}</b>; dat wordt vervangen.` : ''}</p>
      <div class="row"><a class="btn ghost" href="#/vandaag">Niet nu</a><button class="btn primary" onclick="joinBook('${esc(code)}').then(()=>location.replace('#/vandaag'))">Koppelen</button></div>
    </div>`;
}

async function exportBackup() {
  const data = { app: 'kookboek', version: 1, exportedAt: new Date().toISOString(), recipes: liveRecipes() };
  const name = `kookboek-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
  // On phones the share sheet lets you put it straight in iCloud/Google Drive.
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Kookboek back-up' }); }
    catch (e) { if (e.name === 'AbortError') return; }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  settings.lastExport = Date.now(); saveSettings();
  render();
}

async function importBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.recipes;
    if (!Array.isArray(list)) throw new Error();
    let added = 0;
    for (const r of list) {
      if (!r || !r.id || !r.title) continue;
      const cur = recipes.get(r.id);
      if (cur && !cur.deleted && cur.updatedAt >= r.updatedAt) continue;
      await saveRecipe({ ...r });
      added++;
    }
    toast(`${added} ${added === 1 ? 'recept' : 'recepten'} teruggezet`);
    render();
  } catch {
    toast('Dit is geen geldig back-upbestand');
  }
  input.value = '';
}

// ── Boot ────────────────────────────────────────────────────────────────────

// Android share sheet: the manifest's share_target opens ./?url=…&text=…
function takeSharedUrl() {
  const p = new URLSearchParams(location.search);
  const shared = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
  if (!shared) return null;
  history.replaceState(null, '', location.pathname + '#/toevoegen');
  const m = shared.match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

(async function boot() {
  idb = await openDb();
  try { (await dbAll() || []).forEach(r => recipes.set(r.id, r)); } catch {}
  navigator.storage?.persist?.().catch(() => {});

  const sharedUrl = takeSharedUrl();
  window.addEventListener('hashchange', render);
  render();
  if (sharedUrl) importFromUrl(sharedUrl);

  applyTextSize();
  updateOnline();
  renderTimers();
  setInterval(tickTimers, 1000);

  scheduleSync(0);
  setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 60000);
  window.addEventListener('online', () => { scheduleSync(0); migrateImages(); });
  emptyOldTrash();
  // After the first sync, so both phones don't copy the same photos at once.
  setTimeout(migrateImages, 5000);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
