name = "kookboek"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "BOOKS"
class_name = "Book"

# SQLite-backed Durable Objects are available on the free Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Book"]

# Workers AI reads photographed recipes (free daily allocation on the free plan).
[ai]
binding = "AI"

# Daily scan counter (per IP and in total).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]
